<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 920" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1220" height="920" fill="#ffffff"/>
<foreignObject x="20.0" y="18.0" width="994.0" height="12.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:15px;color:#333333;font-weight:bold;line-height:1.35;">CPM message structure — what the Scenario Player sends to the V2X ECU (R1 / R11)</body></foreignObject>
<foreignObject x="20.0" y="42.0" width="994.0" height="10"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#666666;font-weight:normal;line-height:1.35;">ETSI TS 103 324 v2.1.1 · ASN.1 UPER · one PDU per UDP datagram · encoded by the shared R1 codec (Vanetza r2::Cpm)</body></foreignObject>
<rect x="20.0" y="70.0" width="740.0" height="790.0" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" />
<foreignObject x="30.0" y="76.0" width="724.0" height="780.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#333333;font-weight:normal;line-height:1.35;"><b>CollectivePerceptionMessage</b></body></foreignObject>
<rect x="40.0" y="108.0" width="700.0" height="86.0" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
<foreignObject x="50.0" y="114.0" width="684.0" height="76.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>header : ItsPduHeader</b><div style="font-size:11px;color:#444444;margin-top:6px">protocolVersion  = 2<br/>messageId        = <b>cpm (14)</b>  — the CPM/DENM discriminator<br/>stationId        = 1201  (vehicle B, the sender)</div></body></foreignObject>
<rect x="40.0" y="208.0" width="700.0" height="632.0" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" />
<foreignObject x="50.0" y="214.0" width="684.0" height="622.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#333333;font-weight:normal;line-height:1.35;"><b>payload : CpmPayload</b></body></foreignObject>
<rect x="60.0" y="248.0" width="660.0" height="104.0" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" />
<foreignObject x="70.0" y="254.0" width="644.0" height="94.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>managementContainer : ManagementContainer</b><div style="font-size:11px;color:#444444;margin-top:6px">referenceTime     : TimestampIts  — 0,001 s since 2004-01-01 TAI<br/>referencePosition : ReferencePosition  — B's WGS84 pose<br/>      latitude / longitude  (10⁻⁷ degree)  · positionConfidenceEllipse · altitude<br/><i style="color:#888888">segmentationInfo? · messageRateRange?  — unused in M1</i></div></body></foreignObject>
<rect x="60.0" y="368.0" width="660.0" height="452.0" rx="6" fill="#ffffff" stroke="#b3b3b3" stroke-width="1.2" stroke-dasharray="6,4"/>
<foreignObject x="70.0" y="374.0" width="644.0" height="442.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>cpmContainers : WrappedCpmContainers</b> <span style="font-size:11px;color:#666666">SEQUENCE (SIZE 1..8) — M1 sends exactly 2</span></body></foreignObject>
<rect x="80.0" y="408.0" width="620.0" height="92.0" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" />
<foreignObject x="90.0" y="414.0" width="604.0" height="82.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>containerId = 1  ·  OriginatingVehicleContainer</b><div style="font-size:11px;color:#444444;margin-top:6px">orientationAngle : Wgs84Angle  { value (0,1°, 0..3601) , confidence }<br/>       900 = 90,0° East  → maps to R2 sender.heading<br/><i style="color:#888888">pitchAngle? · rollAngle? · trailerDataSet?  — unused in M1</i></div></body></foreignObject>
<rect x="80.0" y="506.0" width="620.0" height="24.0" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.2" />
<foreignObject x="90.0" y="512.0" width="604.0" height="14.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:10px;color:#333333;font-weight:normal;line-height:1.35;"><b>F1</b>  No speed field in release 2 — R2 sender.speed must be derived</body></foreignObject>
<rect x="80.0" y="540.0" width="620.0" height="262.0" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2" />
<foreignObject x="90.0" y="546.0" width="604.0" height="252.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>containerId = 5  ·  PerceivedObjectContainer</b><div style="font-size:11px;color:#444444;margin-top:6px">numberOfPerceivedObjects : CardinalNumber1B  = <b>1</b>  (vehicle C)</div></body></foreignObject>
<rect x="100.0" y="606.0" width="580.0" height="176.0" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" />
<foreignObject x="110.0" y="612.0" width="564.0" height="166.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>perceivedObjects[0] : PerceivedObject</b> <span style="font-size:10px;color:#666666">— vehicle C as measured by B</span><div style="font-size:11px;color:#444444;margin-top:6px">objectId                   : Identifier2B                      0..65535              = 7<br/>measurementDeltaTime  : DeltaTimeMilliSecondSigned   ±2047 ms        = −50<br/>position                   : CartesianPosition3dWithConfidence<br/>       xCoordinate / yCoordinate  { value (0,01 m) , confidence }  = 2500 / 120<br/>velocity?                  : Velocity3dWithConfidence → cartesianVelocity<br/>       xVelocity / yVelocity  { value (0,01 m/s) , confidence }  = 1520<br/>classification?          : ObjectClassDescription (SIZE 1..8)<br/>       [0].objectClass.vehicleSubClass = passengerCar (5)<br/>       [0].confidence : ConfidenceLevel  1..101                    = 95</div></body></foreignObject>
<foreignObject x="82.0" y="798.0" width="614.0" height="10"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:10px;color:#888888;font-weight:normal;line-height:1.35;"><i>containerId 2 OriginatingRsu  ·  3 SensorInformation  ·  4 PerceptionRegion  — not sent in M1</i></body></foreignObject>
<rect x="790.0" y="108.0" width="380.0" height="140.0" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
<foreignObject x="800.0" y="114.0" width="364.0" height="130.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>Wire</b><div style="font-size:11px;color:#444444;margin-top:6px">Scenario Player  10.99.0.10<br/>       ↓  UDP · raw UPER · no BTP/GN envelope (F5)<br/>V2X ECU          10.99.0.11 : 47100<br/><br/>10 Hz default · one CPM per datagram<br/>fire-and-forget · no ack, no session, no auth</div></body></foreignObject>
<rect x="790.0" y="268.0" width="380.0" height="180.0" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" />
<foreignObject x="800.0" y="274.0" width="364.0" height="170.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>M1 profile — the whole message</b><div style="font-size:11px;color:#444444;margin-top:6px">· 1 header + 1 management container<br/>· exactly 2 wrapped containers: id 1 and id 5<br/>· exactly 1 perceived object (vehicle C)<br/>· PerceivedObject's 14 other OPTIONAL fields<br/>   (acceleration, angles, dimensions, objectAge,<br/>   objectPerceptionQuality, sensorIdList,<br/>   correlation matrices, mapPosition) are<br/>   omitted — future extension points needing<br/>   no schema change</div></body></foreignObject>
<rect x="790.0" y="468.0" width="380.0" height="130.0" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.2" />
<foreignObject x="800.0" y="474.0" width="364.0" height="120.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>Derived at the V2X ECU, not transmitted</b><div style="font-size:11px;color:#444444;margin-top:6px">R2 object.distance = hypot(x, y)  <b>(F7)</b><br/>   → the input to R13 track admission (30 m)<br/>R2 sender.speed  from consecutive referenceTime /<br/>   referencePosition deltas  <b>(F1)</b><br/>R2 confidence 0–1  = ConfidenceLevel / 100  <b>(F6)</b></div></body></foreignObject>
<rect x="790.0" y="618.0" width="380.0" height="176.0" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/>
<foreignObject x="800.0" y="624.0" width="364.0" height="166.0"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#333333;font-weight:normal;line-height:1.35;"><b>Not CPM — DENM</b> <span style="font-size:10px;color:#666666">messageId = denm (1)</span><div style="font-size:11px;color:#444444;margin-top:6px">management (actionId, detectionTime, eventPosition,<br/>   validityDuration) · situation (CauseCode /<br/>   SubCauseCode) · location · alacarte<br/><br/>Carries an <b>event</b>, never a perceived object's<br/>position / velocity / class — so it cannot relay C.<br/><b>Not implemented in M1</b>; named family for future<br/>hazard types (one codec module + one R9<br/>dispatch entry to add).</div></body></foreignObject>
<foreignObject x="20.0" y="872.0" width="1144.0" height="10"><body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;font-family:Helvetica,Arial,sans-serif;font-size:10px;color:#888888;font-weight:normal;line-height:1.35;">? = ASN.1 OPTIONAL  ·   grey italics = present in the standard, unused in M1  ·   Fn = finding in scenario-player-v2x-callflow-messages.md §6</body></foreignObject>
</svg>