<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <title>R17 God View — the warning scene: ego A, occluder B, ghost C</title>
  <desc>The R17 warning view as the driver sees it: a slightly inclined top-down view of the road, ego A nearest the viewer, occluder B ahead of it, and ghost C ahead of B drawn as a dashed reconstruction over a ground glow whose colour is the current risk state. No overlays, labels or annotations.</desc>

  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090E"/>
      <stop offset="0.35" stop-color="#0B0C14"/>
      <stop offset="1" stop-color="#12141F"/>
    </linearGradient>
    <linearGradient id="roadFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#262A34"/>
      <stop offset="0.55" stop-color="#1C1F29"/>
      <stop offset="1" stop-color="#14161E"/>
    </linearGradient>
    <linearGradient id="egoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.45" stop-color="#D6DFEA"/>
      <stop offset="1" stop-color="#A5B1C2"/>
    </linearGradient>
    <linearGradient id="bBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B93A2"/>
      <stop offset="0.45" stop-color="#6C7381"/>
      <stop offset="1" stop-color="#4A515C"/>
    </linearGradient>
    <linearGradient id="horizonFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C14" stop-opacity="1"/>
      <stop offset="1" stop-color="#0B0C14" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ================= screen ================= -->
  <rect width="1000" height="640" fill="url(#screenBg)"/>

  <!-- ================= road, viewed at a slight incline ================= -->
  <polygon points="200,640 800,640 680,70 320,70" fill="url(#roadFill)"/>

  <!-- tapered edge lines -->
  <polygon points="195,640 205,640 322.5,70 317.5,70" fill="#3A4050" fill-opacity="0.9"/>
  <polygon points="795,640 805,640 682.5,70 677.5,70" fill="#3A4050" fill-opacity="0.9"/>

  <!-- left lane divider -->
  <g stroke="#333355" stroke-linecap="round">
    <line x1="400.0" y1="640.0" x2="402.3" y2="607.3" stroke-width="6.5"/>
    <line x1="403.8" y1="585.7" x2="406.1" y2="553.7" stroke-width="6.1"/>
    <line x1="407.5" y1="532.6" x2="409.7" y2="501.3" stroke-width="5.7"/>
    <line x1="411.2" y1="480.6" x2="413.3" y2="450.1" stroke-width="5.3"/>
    <line x1="414.7" y1="430.0" x2="416.8" y2="400.2" stroke-width="4.9"/>
    <line x1="418.2" y1="380.7" x2="420.2" y2="351.8" stroke-width="4.5"/>
    <line x1="421.5" y1="332.9" x2="423.5" y2="305.1" stroke-width="4.2"/>
    <line x1="424.8" y1="286.8" x2="426.7" y2="260.1" stroke-width="3.8"/>
    <line x1="427.9" y1="242.6" x2="429.7" y2="217.2" stroke-width="3.5"/>
    <line x1="430.8" y1="200.6" x2="432.5" y2="176.6" stroke-width="3.2"/>
    <line x1="433.6" y1="161.2" x2="435.2" y2="139.0" stroke-width="2.9"/>
    <line x1="436.1" y1="124.9" x2="437.5" y2="105.2" stroke-width="2.6"/>
    <line x1="438.4" y1="93.1" x2="439.5" y2="77.3" stroke-width="2.4"/>
  </g>
  <!-- right lane divider -->
  <g stroke="#333355" stroke-linecap="round">
    <line x1="600.0" y1="640.0" x2="597.7" y2="607.3" stroke-width="6.5"/>
    <line x1="596.2" y1="585.7" x2="593.9" y2="553.7" stroke-width="6.1"/>
    <line x1="592.5" y1="532.6" x2="590.3" y2="501.3" stroke-width="5.7"/>
    <line x1="588.8" y1="480.6" x2="586.7" y2="450.1" stroke-width="5.3"/>
    <line x1="585.3" y1="430.0" x2="583.2" y2="400.2" stroke-width="4.9"/>
    <line x1="581.8" y1="380.7" x2="579.8" y2="351.8" stroke-width="4.5"/>
    <line x1="578.5" y1="332.9" x2="576.5" y2="305.1" stroke-width="4.2"/>
    <line x1="575.2" y1="286.8" x2="573.3" y2="260.1" stroke-width="3.8"/>
    <line x1="572.1" y1="242.6" x2="570.3" y2="217.2" stroke-width="3.5"/>
    <line x1="569.2" y1="200.6" x2="567.5" y2="176.6" stroke-width="3.2"/>
    <line x1="566.4" y1="161.2" x2="564.8" y2="139.0" stroke-width="2.9"/>
    <line x1="563.9" y1="124.9" x2="562.5" y2="105.2" stroke-width="2.6"/>
    <line x1="561.6" y1="93.1" x2="560.5" y2="77.3" stroke-width="2.4"/>
  </g>

  <!-- the road fades out toward the horizon -->
  <rect x="0" y="70" width="1000" height="190" fill="url(#horizonFade)"/>

  <!-- ================= ghost C — relayed, never sensed by A ================= -->
  <g transform="translate(500,190) scale(0.744)">
    <!-- ground glow: colour = current risk state (here HIGH), pulsing -->
    <ellipse cx="0" cy="34" rx="96" ry="50" fill="#FF1A1A" opacity="0.3" filter="url(#softer)">
      <animate attributeName="opacity" values="0.18;0.45;0.18" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="34" rx="80" ry="42" fill="none" stroke="#FF1A1A" stroke-width="9" opacity="0.5" filter="url(#soft)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- reconstructed body: dashed outline, translucent fill, no solid faces -->
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          transform="translate(0,17)" fill="#FF4040" fill-opacity="0.07"/>
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          fill="#FF4040" fill-opacity="0.15" stroke="#FF4040" stroke-width="3.5" stroke-dasharray="12 8"/>
    <rect x="-33" y="-22" width="66" height="34" rx="13" fill="#FF4040" fill-opacity="0.1"
          stroke="#FF4040" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="7 6"/>
    <rect x="-44" y="76" width="24" height="8" rx="4" fill="#FF4040" opacity="0.5"/>
    <rect x="20" y="76" width="24" height="8" rx="4" fill="#FF4040" opacity="0.5"/>
  </g>

  <!-- ================= vehicle B — the occluder ================= -->
  <g transform="translate(500,335) scale(0.855)">
    <ellipse cx="0" cy="46" rx="70" ry="30" fill="#000000" opacity="0.5" filter="url(#soft)"/>
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          transform="translate(0,17)" fill="#3E444F"/>
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          fill="url(#bBody)" stroke="#FFB300" stroke-opacity="0.45" stroke-width="1.6"/>
    <rect x="-59" y="-26" width="13" height="7" rx="3.5" fill="#59606D"/>
    <rect x="46" y="-26" width="13" height="7" rx="3.5" fill="#59606D"/>
    <path d="M-34,-22 h68 l-12,-20 h-44 z" fill="#1D222C"/>
    <rect x="-33" y="-22" width="66" height="34" rx="13" fill="#151A22"/>
    <path d="M-34,12 h68 l-10,18 h-48 z" fill="#1D222C"/>
    <rect x="-36" y="-66" width="20" height="8" rx="4" fill="#E7EDF5" opacity="0.55"/>
    <rect x="16" y="-66" width="20" height="8" rx="4" fill="#E7EDF5" opacity="0.55"/>
    <rect x="-44" y="76" width="24" height="8" rx="4" fill="#FF3B30" opacity="0.8"/>
    <rect x="20" y="76" width="24" height="8" rx="4" fill="#FF3B30" opacity="0.8"/>
  </g>

  <!-- ================= ego A ================= -->
  <g transform="translate(500,525)">
    <ellipse cx="0" cy="46" rx="80" ry="34" fill="#000000" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="0" cy="34" rx="96" ry="48" fill="#00D4FF" opacity="0.13" filter="url(#softer)"/>
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          transform="translate(0,17)" fill="#7C8798"/>
    <path d="M0,-75 c27,0 46,10 46,28 c4,27 8,50 8,77 c0,20 -18,45 -54,45 -36,0 -54,-25 -54,-45 c0,-27 4,-50 8,-77 c0,-18 19,-28 46,-28 z"
          fill="url(#egoBody)" stroke="#EAF6FF" stroke-opacity="0.6" stroke-width="1.8"/>
    <rect x="-59" y="-26" width="13" height="7" rx="3.5" fill="#AEB8C6"/>
    <rect x="46" y="-26" width="13" height="7" rx="3.5" fill="#AEB8C6"/>
    <path d="M-34,-22 h68 l-12,-20 h-44 z" fill="#1B2430"/>
    <rect x="-33" y="-22" width="66" height="34" rx="13" fill="#141C26"/>
    <path d="M-34,12 h68 l-10,18 h-48 z" fill="#1B2430"/>
    <rect x="-36" y="-66" width="20" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="16" y="-66" width="20" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-44" y="76" width="24" height="8" rx="4" fill="#FF3B30" opacity="0.85"/>
    <rect x="20" y="76" width="24" height="8" rx="4" fill="#FF3B30" opacity="0.85"/>
  </g>

  <rect width="1000" height="640" fill="url(#vignette)"/>
</svg>
