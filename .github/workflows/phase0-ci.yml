# The two lanes that are Phase 0's OWN artifacts, and the only two this file holds:
#   * contracts-gate - the repo-wide static gate over the frozen R1-R6 contracts (1.0.7.1);
#   * netcheck-image - the smoke-test tool's arm64 image (6.0.8.1).
# Neither exercises a node. The gate is a source check spanning all four folders, and netcheck is
# test equipment that stands in for no node at all.
#
# WHERE A NEW JOB GOES: .claude/rules/ci-lane-placement.md designates the file for every lane, and
# a lane lives with the NODE IT EXERCISES rather than the phase that wrote it. This file therefore
# gains a job only when Phase 0 itself gains an artifact. The node lanes live with their nodes:
#   * v2x-core-build, sp-unit-tests           -> phase1-ci.yml (the V2X ECU and the bench)
#   * ada-core-build                          -> phase2-ci.yml (the ADA scaffold)
#   * ada-detector-tests                      -> phase3-ci.yml (the ADA detector)
#   * ivi-unit-tests                          -> phase5-ci.yml (the IVI ECU)
#
# Every phase<N>-ci.yml carries the same `on:` triggers, so a lane runs on every push and pull
# request wherever it lives - placement decides where a lane is MAINTAINED, never whether it
# executes. A lane is never duplicated into a second file to make it run.
name: phase0-ci

on:
  push:
  pull_request:
    branches: [main]

# Superseded runs are cancelled rather than left to finish - see the fuller note in phase1-ci.yml.
# Cheap here (netcheck-image is a ~40 s build), but it keeps the workflow files behaving alike.
# Safe for the one-shot golden-vector publish step, which is guarded on contracts/golden-vectors/
# being absent - which it no longer is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both steps are static source checks over the frozen contracts, which is why they sit together
  # here rather than with a node: check_sync.py compares every node-local contract copy against its
  # master across all four folders, and the R7 gate (added by 7.1.3.5) is a grep over V2X sources
  # that compiles nothing. A lane that BUILDS a node belongs to that node's phase file.
  contracts-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract byte-identity gate (lands with 1.0.7.1)
        run: |
          if [ -f contracts/check_sync.py ]; then
            python contracts/check_sync.py
          else
            echo "contracts/check_sync.py not landed yet (subtask 1.0.7.1) - skipping"
          fi
      - name: R7 transport-import gate (lands with 7.1.3.5)
        run: |
          if [ -f V2X_ECU/tools/check_transport_imports.py ]; then
            python V2X_ECU/tools/check_transport_imports.py
          else
            echo "V2X_ECU/tools/check_transport_imports.py not landed yet (subtask 7.1.3.5) - skipping"
          fi

  netcheck-image:
    runs-on: ubuntu-latest
    env:
      # Live host per the O1 probe (2026-07-31): registry.carsky.io 502s, hackathon-2 answers.
      REGISTRY_HOST: registry.hackathon-2.carsky.io
      IMAGE: m1-netcheck:latest
      # arm64 only: the cluster's runnable evidence is uniformly aarch64 (AAOS skycraft artifact,
      # and tanbd2/dummy-video-color - the one arm64-only team image in the registry). A
      # single-arch manifest also matches the shape of the images that the registry has actually
      # served (both non-KIS repos are single-arch), removing the index as a variable.
      PLATFORMS: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build netcheck image (smoke-test M3)
        # --provenance/--sbom=false: buildx otherwise adds unknown/unknown attestation entries
        # to the manifest index, which older containerd releases fail to resolve (a second
        # pull-failure mode observed on the 2026-07-31 deploy after the multi-arch push).
        run: docker buildx build --platform "$PLATFORMS" --provenance=false --sbom=false -t "$IMAGE" tools/netcheck/
      - name: Push to CarSky Zot registry (M2+M4; skips until the secret exists)
        id: push
        env:
          ZOT_KEY: ${{ secrets.CARSKY_ZOT_API_KEY }}
          # Registry account (not a secret) - verified live 2026-07-31: this user plus the
          # CARSKY_ZOT_API_KEY secret returns 200 on /v2/. Override with the
          # CARSKY_REGISTRY_USER repo variable if the account changes.
          REGISTRY_USER: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
        # `pushed` is written exactly once, at the end, rather than in each branch: the value gates
        # the verification step below, and one unconditional write removes any question of what a
        # repeated key in $GITHUB_OUTPUT resolves to.
        run: |
          PUSHED=false
          DIGEST=""
          if [ -z "$ZOT_KEY" ]; then
            echo "::notice::CARSKY_ZOT_API_KEY secret not set - image built but NOT pushed (M4 pending)"
          else
            echo "$ZOT_KEY" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
            # --metadata-file: buildx writes the digest it actually pushed, which is what the
            # verification below must check. Resolving the tag there instead would verify whatever
            # :latest points to at that moment - a different run's image, if one raced us.
            docker buildx build --platform "$PLATFORMS" --provenance=false --sbom=false -t "$REGISTRY_HOST/$IMAGE" --push --metadata-file "$RUNNER_TEMP/netcheck-push.json" tools/netcheck/
            DIGEST=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/netcheck-push.json")
            echo "::notice::pushed $REGISTRY_HOST/$IMAGE ($PLATFORMS) digest=${DIGEST:-unreported}"
            PUSHED=true
          fi
          {
            echo "pushed=$PUSHED"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
      # Proves the pushed tag is what a Container node can pull and start, rather than trusting the
      # build log - the check that would have caught the 2026-07-31 Provisioning hang before the
      # deploy. Gated on the push actually happening: with no secret there is nothing to verify.
      - name: Verify the pushed image is pullable and single-platform arm64
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/verify-arm64-image
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          image: ${{ env.IMAGE }}
          username: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
          password: ${{ secrets.CARSKY_ZOT_API_KEY }}
          digest: ${{ steps.push.outputs.digest }}
