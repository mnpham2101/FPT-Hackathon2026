# The four lanes that originate in Phase 3: ada-detector-wheels (12.3.1.1), ada-detector-tests
# (12.3.3.3), ada-detector-run (12.3.3.4) and ada-zero-c (12.3.5.4) - the ADA detector's
# dependency-feasibility, unit-test, measurement and zero-C-evidence lanes.
#
# This file carries ONLY those four. The Phase 0 lanes live in .github/workflows/phase0-ci.yml,
# the Phase 1 lanes in phase1-ci.yml, the Phase 2 lane in phase2-ci.yml, and the node-image lanes
# in phase4-ci.yml. All files use the same push/pull_request triggers, so every job runs on every
# push and pull request; a lane belongs to the phase that created it, not to the phase that last
# touched it.
#
# Every job block below is fully self-contained - no YAML anchors shared across jobs - and is
# delimited by a `# ---- <job-name> (<subtask-id>) ----` comment line, so each lane can land as
# its own commit without touching the others.
name: phase3-ci

on:
  push:
  pull_request:
    branches: [main]
  # ---- workflow_dispatch inputs (serve ada-detector-run, 12.3.3.4) ----
  # Manual-dispatch knobs for the measurement lane ONLY: each input is read by the
  # ada-detector-run job via `${{ inputs.<name> || '<default>' }}`, so push/PR runs - where the
  # inputs context is empty - take these same defaults, which equal the detector's own env
  # defaults. The other three jobs read none of these.
  workflow_dispatch:
    inputs:
      duration_s:
        description: "Wall-clock seconds each measurement arm runs"
        type: string
        default: "60"
      frame_stride:
        description: "DETECTOR_FRAME_STRIDE - process every Nth frame"
        type: string
        default: "4"
      conf_threshold:
        description: "CONF_THRESHOLD - detection confidence floor"
        type: string
        default: "0.35"
      iou_threshold:
        description: "IOU_THRESHOLD - NMS IoU threshold"
        type: string
        default: "0.45"
      vehicle_width_m:
        description: "VEHICLE_WIDTH_M - assumed real vehicle width for monocular ranging"
        type: string
        default: "1.8"
      camera_hfov_deg:
        description: "CAMERA_HFOV_DEG - camera horizontal field of view"
        type: string
        default: "60"
  # ---- end workflow_dispatch inputs ----

# Superseded runs are cancelled rather than left to finish - same policy as phase0/1/2-ci.yml
# (the fuller note is in phase1-ci.yml). Per ref, so main and a feature branch never cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- ada-detector-wheels (12.3.1.1) ----
  # Dependency feasibility, proved BEFORE any detector code runs: the detector's pinned deps
  # must install as PREBUILT wheels for linux/arm64 on python:3.11-slim - the platform and base
  # image the ADA node ships on. --only-binary=:all: is the point of the lane: a missing aarch64
  # wheel makes pip exit non-zero NAMING the package, instead of silently starting a multi-hour
  # emulated source build.
  ada-detector-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # QEMU so the amd64 runner can execute the linux/arm64 python:3.11-slim container below.
      - uses: docker/setup-qemu-action@v3
      - name: Install pinned deps as prebuilt arm64 wheels, then import-smoke them
        shell: bash
        run: |
          set -euo pipefail

          # One container invocation does both the install and the import smoke (`sh -s` reads
          # the script from the heredoc), so the smoke runs against exactly the site-packages
          # the install just produced. Capture-then-assert: under `set -e` a bare failing
          # docker run would end the step before the escalation note could print.
          STATUS=0
          docker run --rm -i --platform linux/arm64 python:3.11-slim sh -s <<'SH' || STATUS=$?
          set -eu
          python -m pip install --only-binary=:all: \
            'onnxruntime==1.28.0' 'opencv-python-headless==5.0.0.93' 'numpy==2.4.6'
          python -c "import onnxruntime, cv2, numpy; print('onnxruntime', onnxruntime.__version__); print('opencv', cv2.__version__); print('numpy', numpy.__version__)"
          SH

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::a pinned detector dependency has no prebuilt linux/arm64 wheel for python:3.11-slim (or fails to import there). Escalate to project-architecture - the options are: pin an older onnxruntime that ships an aarch64 wheel, switch the base image to a distro whose apt carries the package, or accept a source build with a raised timeout. The choice belongs to project-architecture, not the implementer."
            exit "$STATUS"
          fi
          echo "::notice::onnxruntime 1.28.0, opencv-python-headless 5.0.0.93 and numpy 2.4.6 all install as prebuilt linux/arm64 wheels on python:3.11-slim and import cleanly"

  # ---- ada-detector-tests (12.3.3.3) ----
  # The Linux lane where the detector pytest suite runs UNSKIPPED: full pinned dependencies on
  # the runner, python 3.11 to match the node image's python:3.11-slim base. A skip here is
  # never environmental - it means a missing dependency or artifact, so it fails the lane
  # loudly instead of shrinking the suite.
  ada-detector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Detector suite (full deps, zero skips tolerated)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ADA_ECU/detector/requirements.txt ]; then
            echo "::notice::ADA_ECU/detector/requirements.txt not landed yet (12.3.2.1) - skipping"
            exit 0
          fi
          python -m pip install -r ADA_ECU/detector/requirements.txt -r ADA_ECU/detector/requirements-dev.txt

          # `set -o pipefail` makes a pytest failure propagate through tee (the pipeline exits
          # with pytest's status, and `set -e` ends the step on it); the grep below then adds
          # the no-skip assertion on top of an otherwise green run. -rs prints the reason line
          # for every skip, so a red run names the missing piece in the job output.
          python -m pytest ADA_ECU/detector/tests -q -rs | tee "$RUNNER_TEMP/pytest.out"

          if grep -E 'SKIPPED|[0-9]+ skipped' "$RUNNER_TEMP/pytest.out"; then
            echo "::error::detector suite skipped tests on the full-dependency lane - a skip here means a missing dependency or artifact"
            exit 1
          fi
          echo "[LANE] detector suite green with zero skips"

  # ---- ada-detector-run (12.3.3.4) ----
  # Runs the REAL detector (ADA_ECU/detector/main.py, the committed ONNX model, the committed
  # clip) on the Linux runner in two timed arms and uploads the captured stdout as a workflow
  # artifact:
  #   * arm 1 (paced)   - DETECTOR_REALTIME_PACING=true: the node's real emit behaviour; the
  #     summary reports line count, warm-up, effective rate, and the max inter-line arrival
  #     gap (the clip-pass re-open proxy).
  #   * arm 2 (unpaced) - DETECTOR_REALTIME_PACING=false: the CPU-throughput measurement
  #     (KPI 3). Pacing fixes the emit interval at stride/fps regardless of inference speed,
  #     so only the unpaced arm measures CPU throughput; its summary adds the per-sampled-frame
  #     inference cost in ms.
  # Knobs come from the workflow_dispatch inputs in `on:`; push/PR runs take the defaults.
  ada-detector-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run both timed arms over the committed clip
        shell: bash
        run: |
          set -euo pipefail

          # Landed-file guard: the model (12.3.3.1) and the pinned requirements (12.3.2.1) are
          # other subtasks' deliverables; until both are on the tree this lane degrades to a
          # notice instead of a red run.
          for REQUIRED in ADA_ECU/models/yolo11n.onnx ADA_ECU/detector/requirements.txt; do
            if [ ! -f "$REQUIRED" ]; then
              echo "::notice::$REQUIRED not landed yet (12.3.3.1 / 12.3.2.1) - skipping"
              exit 0
            fi
          done

          python -m pip install -r ADA_ECU/detector/requirements.txt

          # The driver, shared by both arms: spawns the detector, timestamps every stdout
          # line's arrival (time.monotonic), stops the run at the wall-clock duration with
          # SIGTERM (the detector exits 0 on it), and writes four files per arm - the stdout
          # capture, the stderr capture, and a JSON + text summary. The max inter-line arrival
          # gap is the clip-pass re-open proxy; the summary states that it approximates the
          # loop re-open interval.
          cat > "$RUNNER_TEMP/run_detector.py" <<'PY'
          import json
          import signal
          import subprocess
          import sys
          import threading
          import time

          prefix = sys.argv[1]            # output-path prefix; four files written beside it
          duration_s = float(sys.argv[2])
          label = sys.argv[3]             # "paced" | "unpaced"

          stderr_file = open(prefix + ".stderr.log", "wb")
          spawn_t = time.monotonic()
          proc = subprocess.Popen(
              [sys.executable, "ADA_ECU/detector/main.py"],
              stdout=subprocess.PIPE,
              stderr=stderr_file,
          )

          records = []  # (arrival time.monotonic(), raw line bytes)

          def reader():
              for raw in proc.stdout:
                  records.append((time.monotonic(), raw))

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()

          # Wall-clock stop, slept in short slices so an early detector exit is noticed
          # promptly instead of after the full duration.
          while time.monotonic() - spawn_t < duration_s and proc.poll() is None:
              time.sleep(min(0.5, max(0.0, duration_s - (time.monotonic() - spawn_t))))

          stopped_early = proc.poll() is not None
          if not stopped_early:
              proc.send_signal(signal.SIGTERM)
          try:
              exit_code = proc.wait(timeout=30)
          except subprocess.TimeoutExpired:
              proc.kill()
              exit_code = proc.wait()
          thread.join(timeout=10)
          stderr_file.close()

          with open(prefix + ".stdout.jsonl", "wb") as f:
              for _arrival, raw in records:
                  f.write(raw)

          count = len(records)
          elapsed_s = time.monotonic() - spawn_t
          warmup_s = records[0][0] - spawn_t if count else None
          span_s = records[-1][0] - records[0][0] if count >= 2 else None
          rate = (count - 1) / span_s if span_s else None
          max_gap_s = max(b[0] - a[0] for a, b in zip(records, records[1:])) if count >= 2 else None

          summary = {
              "arm": label,
              "line_count": count,
              "elapsed_wall_s": round(elapsed_s, 3),
              "warmup_s": round(warmup_s, 3) if warmup_s is not None else None,
              "effective_rate_lines_per_s": round(rate, 3) if rate is not None else None,
              "max_inter_line_gap_s": round(max_gap_s, 3) if max_gap_s is not None else None,
              "max_gap_note": "the max inter-line arrival gap is the clip-pass re-open proxy: it approximates the loop re-open interval",
              "stopped_early": stopped_early,
              "detector_exit_code": exit_code,
          }
          if label == "unpaced" and span_s:
              # Only the unpaced arm measures CPU throughput: pacing fixes the emit interval
              # at stride/fps regardless of how fast inference actually is.
              summary["per_sampled_frame_inference_ms"] = round(1000.0 * span_s / (count - 1), 3)

          with open(prefix + ".summary.json", "w") as f:
              json.dump(summary, f, indent=2)
              f.write("\n")

          text = "\n".join("%s: %s" % (key, value) for key, value in summary.items()) + "\n"
          with open(prefix + ".summary.txt", "w") as f:
              f.write(text)
          print("[DRIVER] %s arm summary" % label)
          print(text, flush=True)

          if count == 0:
              print("::error::empty detection log - the %s arm produced zero stdout lines in %.0f s" % (label, duration_s), flush=True)
              sys.exit(1)
          if exit_code != 0:
              print("::error::detector exited %s on the %s arm - expected 0 on SIGTERM/clean stop" % (exit_code, label), flush=True)
              sys.exit(1)
          PY

          DURATION_S="${{ inputs.duration_s || '60' }}"
          export VIDEO_CLIP_PATH=ADA_ECU/media/ego-b-occluding-c.mp4
          export MODEL_PATH=ADA_ECU/models/yolo11n.onnx
          export DETECTOR_LOOP=true
          export DETECTOR_FRAME_STRIDE="${{ inputs.frame_stride || '4' }}"
          export CONF_THRESHOLD="${{ inputs.conf_threshold || '0.35' }}"
          export IOU_THRESHOLD="${{ inputs.iou_threshold || '0.45' }}"
          export VEHICLE_WIDTH_M="${{ inputs.vehicle_width_m || '1.8' }}"
          export CAMERA_HFOV_DEG="${{ inputs.camera_hfov_deg || '60' }}"

          echo "[LANE] arm 1 (paced): ${DURATION_S}s, stride $DETECTOR_FRAME_STRIDE"
          DETECTOR_REALTIME_PACING=true \
            python "$RUNNER_TEMP/run_detector.py" "$RUNNER_TEMP/ada-detector-paced" "$DURATION_S" paced

          # Pacing fixes the emit interval at stride/fps, so only this arm's rate reflects
          # what the CPU can actually sustain (KPI 3).
          echo "[LANE] arm 2 (unpaced, CPU-throughput measurement): ${DURATION_S}s, stride $DETECTOR_FRAME_STRIDE"
          DETECTOR_REALTIME_PACING=false \
            python "$RUNNER_TEMP/run_detector.py" "$RUNNER_TEMP/ada-detector-unpaced" "$DURATION_S" unpaced

          echo "[LANE] both arms completed cleanly"
      # Always, so a red arm's captures and summaries are still retrievable for diagnosis;
      # warn (not error) on missing files because the landed-file guard above may have skipped
      # the run entirely.
      - name: Upload run captures and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ada-detector-run
          path: |
            ${{ runner.temp }}/ada-detector-paced.stdout.jsonl
            ${{ runner.temp }}/ada-detector-paced.stderr.log
            ${{ runner.temp }}/ada-detector-paced.summary.json
            ${{ runner.temp }}/ada-detector-paced.summary.txt
            ${{ runner.temp }}/ada-detector-unpaced.stdout.jsonl
            ${{ runner.temp }}/ada-detector-unpaced.stderr.log
            ${{ runner.temp }}/ada-detector-unpaced.summary.json
            ${{ runner.temp }}/ada-detector-unpaced.summary.txt
          if-no-files-found: warn

  # ---- ada-zero-c (12.3.5.4) ----
  # The repeatable form of the zero-C check: one single pass of the real detector over the
  # committed clip (loop off, pacing off, exit 0 on clean EOF), then
  # ADA_ECU/tools/check_zero_c.py over the captured R3 stream - a non-zero checker exit fails
  # the job. The synthetic source is NOT a fallback here: it yields zero detections and
  # nothing to examine, so the clip and model must be present or the lane skips with a notice.
  ada-zero-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Single pass over the committed clip, then the zero-C checker
        shell: bash
        run: |
          set -euo pipefail

          # Landed-file guard: model (12.3.3.1), checker (12.3.5.x) and pinned requirements
          # (12.3.2.1) are other subtasks' deliverables.
          for REQUIRED in ADA_ECU/models/yolo11n.onnx ADA_ECU/tools/check_zero_c.py ADA_ECU/detector/requirements.txt; do
            if [ ! -f "$REQUIRED" ]; then
              echo "::notice::$REQUIRED not landed yet - skipping"
              exit 0
            fi
          done

          python -m pip install -r ADA_ECU/detector/requirements.txt

          DETECTIONS="$RUNNER_TEMP/detections.jsonl"
          STDERR_LOG="$RUNNER_TEMP/zero-c-detector-stderr.log"

          # Capture-then-assert: a non-zero detector exit must not end the step before the
          # stderr diagnostics can be printed.
          echo "[LANE] single pass over ADA_ECU/media/ego-b-occluding-c.mp4 (loop off, pacing off)"
          STATUS=0
          DETECTOR_LOOP=false \
          DETECTOR_REALTIME_PACING=false \
          VIDEO_CLIP_PATH=ADA_ECU/media/ego-b-occluding-c.mp4 \
          MODEL_PATH=ADA_ECU/models/yolo11n.onnx \
            python ADA_ECU/detector/main.py > "$DETECTIONS" 2> "$STDERR_LOG" || STATUS=$?

          echo "::group::detector stderr"
          cat "$STDERR_LOG" || true
          echo "::endgroup::"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::detector exited $STATUS on the single pass (expected 0 on clean EOF)"
            exit 1
          fi

          if [ ! -s "$DETECTIONS" ]; then
            echo "::error::empty detection log - the single pass produced no R3 lines to examine"
            exit 1
          fi
          echo "[LANE] captured $(wc -l < "$DETECTIONS") R3 lines"

          # The verdict: the checker prints its examined counts and exits non-zero on any C
          # detection - and also on an empty log, so a vacuous pass is impossible.
          python ADA_ECU/tools/check_zero_c.py "$DETECTIONS"
          echo "[LANE] zero-C check PASSED"
