# The six lanes of the two nodes Phase 1 develops - the V2X ECU and the bench:
#   * v2x-core-build      - full V2X build, the whole CTest suite, gv_tool determinism;
#   * v2x-comms-check     - the D7 loopback acceptance (9.1.12.3);
#   * v2x-ecu-image       - the V2X node's arm64 image (5.1.8.2);
#   * sp-unit-tests       - the Scenario_Player suite on a plain Python runner;
#   * sp-codec-helper     - cpm_encode built natively, the same suite unskipped (11.1.8.1);
#   * scenario-player-image - the bench's arm64 image (5.1.8.2).
#
# WHERE A NEW JOB GOES: .claude/rules/ci-lane-placement.md designates the file for every lane, and
# a lane lives with the NODE IT EXERCISES rather than the phase that wrote it. v2x-core-build and
# sp-unit-tests are here for that reason though Phase 0 wrote them; the R7 transport-import gate
# step 7.1.3.5 added stays in phase0-ci.yml's contracts-gate, because that job compiles nothing and
# gates the frozen contracts across all four folders.
#
# Every phase<N>-ci.yml carries the same `on:` triggers, so a lane runs on every push and pull
# request wherever it lives - placement decides where a lane is MAINTAINED, never whether it
# executes.
#
# ONE VANETZA CACHE, TWO LANES: v2x-core-build and v2x-comms-check share a single actions/cache
# entry through byte-identical key and restore-keys, so the second lane never repays the ~1400-TU
# ASN.1 compile. Both keys are in this file, so a Vanetza re-pin updates them where it is made.
# sp-codec-helper keeps a third, deliberately separate key: it caches a different build directory.
#
# What the two image lanes do beyond building, and why it matters: a green build proves the image
# compiles, NOT that the platform can run it. Each image lane therefore ends by verifying the
# PUSHED artifact through .github/actions/verify-arm64-image (single-platform arm64 manifest, never
# an index; pulls back; starts under QEMU) and then running the real application inside the pulled
# image. Before this, the only thing that closed that gap was deploying to a Room and looking.
name: phase1-ci

on:
  push:
  pull_request:
    branches: [main]

# Superseded runs are cancelled rather than left to finish. Without this, three pushes inside three
# minutes start three FULL sets of the emulated arm64 image builds - observed 2026-08-02, eight
# concurrent ~20-minute builds across four runs - and they then race to overwrite the same two
# mutable :latest tags in the registry, so the tag ends up holding whichever run finished last
# rather than the newest commit. Per ref, so main and a feature branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2x-core-build:
    runs-on: ubuntu-latest
    # Vanetza's asn1c-generated C (asn1_support + asn1_its + asn1_its_r2, ~1400 translation units)
    # is a long first-run compile, hence the raised timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost (Vanetza hard dependency)
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libboost-date-time-dev
      # The cache key carries the exact Vanetza pin, so a re-pin invalidates it. _deps holds the
      # clone, the FetchContent stamps and Vanetza's own object files, so a cache hit skips both
      # the clone and the ASN.1 recompile. Key and restore-keys are byte-identical to
      # v2x-comms-check's below on purpose - the two lanes warm one tree (see the header).
      - name: Cache Vanetza FetchContent deps
        uses: actions/cache@v4
        with:
          path: V2X_ECU/build/_deps
          key: v2x-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-gtest-v1.14.0-${{ hashFiles('V2X_ECU/CMakeLists.txt', 'V2X_ECU/cmake/vanetza-pin.cmake') }}
          restore-keys: |
            v2x-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-gtest-v1.14.0-
      - name: Configure
        run: cmake -S V2X_ECU -B V2X_ECU/build
      # Bounded parallelism on purpose: a bare `-j` makes CMake pass `-j` with no number to make,
      # i.e. unlimited jobs - ~700 concurrent compilers for asn1_its alone would OOM the runner.
      - name: Build
        run: cmake --build V2X_ECU/build -j $(nproc)
      - name: Test
        run: ctest --test-dir V2X_ECU/build --output-on-failure
      - name: Generate golden vectors (run 1)
        run: V2X_ECU/build/gv_tool "$RUNNER_TEMP/gv1"
      - name: Generate golden vectors (run 2)
        run: V2X_ECU/build/gv_tool "$RUNNER_TEMP/gv2"
      # Determinism is 1.0.2.4's acceptance: the same tool run twice must emit byte-identical
      # trees. diff exits non-zero on any difference, which fails the step.
      - name: Golden-vector determinism check
        run: diff -r "$RUNNER_TEMP/gv1" "$RUNNER_TEMP/gv2"
      # The corpus is generated on Linux and handed back as an artifact for inspection. The frozen
      # copy lives in contracts/golden-vectors/, published once by 1.0.2.4 and committed since;
      # sp-codec-helper's test_encoder_golden.py is what checks an encoder against it.
      - name: Upload golden-vector corpus
        uses: actions/upload-artifact@v4
        with:
          name: golden-vectors
          path: ${{ runner.temp }}/gv1

  # The bench suite on a plain Python runner, with no cpm_encode binary present: 116 passed, 7
  # skipped, in about a second. sp-codec-helper below runs the SAME suite with ENCODER_PATH set and
  # reports 123 passed, 0 skipped - it is the wire-truth lane, and it pays a Vanetza build to get
  # there. This one is the fast signal that a bench change compiles and its logic holds, available
  # minutes before the heavy lane finishes. Any other split of those numbers means drift.
  sp-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scenario_Player unit tests
        run: |
          python -m pip install -r Scenario_Player/requirements-dev.txt
          python -m pytest Scenario_Player/tests

  # D7 (V2X HLD §3) CI-side acceptance: a bench-sent CPM is received, raises events, deserializes to
  # JSON and is forwarded as R2. No landed-file guard on purpose - V2X_ECU/src/main.cpp and
  # tools/comms_check/ are both on the tree, so the skip-with-notice pattern the Phase 0 placeholder
  # lanes use would never fire; a missing file here should fail the lane, not silently pass it.
  v2x-comms-check:
    runs-on: ubuntu-latest
    # Same reason as v2x-core-build above: on a cold _deps cache this pays Vanetza's ~1400-TU
    # ASN.1 compile before it can link v2x_ecu.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Boost (Vanetza hard dependency)
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libboost-date-time-dev
      # key + restore-keys are byte-identical to v2x-core-build's above on purpose: the two lanes
      # share one warmed _deps tree, so this job never repays the ASN.1 recompile. Re-pinning
      # Vanetza updates both keys, and both are in this file.
      - name: Cache Vanetza FetchContent deps
        uses: actions/cache@v4
        with:
          path: V2X_ECU/build/_deps
          key: v2x-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-gtest-v1.14.0-${{ hashFiles('V2X_ECU/CMakeLists.txt', 'V2X_ECU/cmake/vanetza-pin.cmake') }}
          restore-keys: |
            v2x-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-gtest-v1.14.0-
      - name: Configure
        run: cmake -S V2X_ECU -B V2X_ECU/build
      # Bounded parallelism for the same reason as v2x-core-build (a bare `-j` is unlimited jobs
      # and OOMs the runner on asn1_its). Only the app target: the test binaries belong to that
      # job, this lane needs the executable at the pinned path V2X_ECU/build/v2x_ecu.
      - name: Build v2x_ecu
        run: cmake --build V2X_ECU/build --target v2x_ecu -j $(nproc)
      - name: Loopback comms check (send golden vectors, assert the [EVT] chain)
        shell: bash
        run: |
          set -euo pipefail

          # Blueprint ports (HLD §6). Fixed values are safe here: the whole lane is loopback-only
          # inside a fresh runner, so nothing else can hold them.
          LISTEN_PORT=47100
          ADA_PORT=47200
          V2X_LOG="$RUNNER_TEMP/v2x.log"
          SINK_LOG="$RUNNER_TEMP/ada_sink.log"

          # UDP sink standing in for the ADA ECU (ADA's real code is Phase 2). A UDP sendto
          # succeeds with no listener at all, so this is not here to keep the forwarder happy - it
          # is the R2-arrival evidence: one "len=" line per datagram that actually reached the
          # forward target.
          cat > "$RUNNER_TEMP/ada_sink.py" <<'PY'
          import socket
          import sys

          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(("127.0.0.1", int(sys.argv[1])))
          print("[SINK] bound port=%s" % sys.argv[1], flush=True)
          while True:                                   # runs until the lane kills it
              data, _ = sock.recvfrom(65535)
              print("len=%d" % len(data), flush=True)
          PY

          echo "[LANE] starting the ADA sink on 127.0.0.1:$ADA_PORT"
          python "$RUNNER_TEMP/ada_sink.py" "$ADA_PORT" > "$SINK_LOG" 2>&1 &
          SINK_PID=$!

          # Bounded readiness poll, never a bare sleep: a datagram sent before the bind is simply
          # lost, which would surface as a confusing count mismatch instead of a clear error.
          SINK_READY=0
          for _ in $(seq 1 30); do
            if grep -q '\[SINK\] bound' "$SINK_LOG" 2>/dev/null; then SINK_READY=1; break; fi
            sleep 0.2
          done
          if [ "$SINK_READY" -ne 1 ]; then
            echo "::error::ADA sink did not bind 127.0.0.1:$ADA_PORT within 6s"
            cat "$SINK_LOG" || true
            kill -TERM "$SINK_PID" 2>/dev/null || true
            exit 1
          fi

          # DEDUPE_WINDOW_MS=1 is deliberate test configuration (env-injected per HLD §6, not a
          # hardcoded tunable): four of the six golden vectors - conf-unavailable, coord-large,
          # gate-boundary and nominal - carry the same stationId 1201, objectId 7, referenceTime
          # and measurementDeltaTime -50, i.e. one R9 dedupe key (stationId, objectId,
          # referenceTime + measurementDeltaTime). Under the 1500 ms default three of them would
          # be dropped and the expected-vector check would correctly fail. A 1 ms window plus
          # --delay-ms 100 below (send gap >= window) puts every repeat of that key outside it.
          echo "[LANE] starting v2x_ecu (stub radio, FAULT_PLAN=none, listen $LISTEN_PORT)"
          LISTEN_PORT="$LISTEN_PORT" \
          ADA_ECU_HOST=127.0.0.1 \
          ADA_ECU_PORT="$ADA_PORT" \
          FAULT_PLAN=none \
          DEDUPE_WINDOW_MS=1 \
            V2X_ECU/build/v2x_ecu > "$V2X_LOG" 2>&1 &
          APP_PID=$!

          # Readiness = main.cpp's bring-up-complete banner (init -> configure -> subscribeRx all
          # acked and the Rx socket bound). Bounded wait, loud failure.
          APP_READY=0
          for _ in $(seq 1 30); do
            if grep -q '\[BOOT\] bring-up complete' "$V2X_LOG" 2>/dev/null; then APP_READY=1; break; fi
            sleep 0.2
          done
          if [ "$APP_READY" -ne 1 ]; then
            echo "::error::v2x_ecu never logged '[BOOT] bring-up complete' within 6s"
            cat "$V2X_LOG" || true
            kill -TERM "$APP_PID" 2>/dev/null || true
            kill -TERM "$SINK_PID" 2>/dev/null || true
            exit 1
          fi

          # Repeat 1 (the default): expected-vector mode expects exactly one complete chain per
          # golden case, so a second pass would only add ambiguity here.
          echo "[LANE] sending the golden-vector corpus"
          python tools/comms_check/send_cpm.py 127.0.0.1 "$LISTEN_PORT" --delay-ms 100

          # Drain time: decode/validate/dedupe/forward run on the Rx thread, so the last datagram
          # needs a moment to reach the sink before teardown. Bounded and generous - the
          # assertions below, not this sleep, are what decide the lane.
          sleep 2

          echo "[LANE] stopping v2x_ecu (SIGTERM)"
          kill -TERM "$APP_PID"
          APP_STATUS=0
          wait "$APP_PID" || APP_STATUS=$?
          kill -TERM "$SINK_PID" 2>/dev/null || true
          wait "$SINK_PID" 2>/dev/null || true

          # Dump both logs BEFORE any assertion, so a red run is diagnosable from the job output
          # alone (they also ship as an artifact below).
          echo "::group::v2x_ecu stdout"
          cat "$V2X_LOG"
          echo "::endgroup::"
          echo "::group::ADA sink"
          cat "$SINK_LOG"
          echo "::endgroup::"

          # main.cpp exit codes: 0 = clean SIGTERM shutdown; 2/3/4/5 = config / init / configure /
          # subscribeRx failure.
          if [ "$APP_STATUS" -ne 0 ]; then
            echo "::error::v2x_ecu exited $APP_STATUS on SIGTERM (expected 0)"
            exit 1
          fi

          # The D7 assertion itself: per vector rx_datagram -> decode_ok carrying the decoded
          # CpmContent JSON -> r2_forwarded carrying the R2 body, with zero decode rejects.
          # [BOOT]/[FWD-ERR] and any other non-[EVT] text in the capture is ignored by design.
          python tools/comms_check/check_v2x_log.py "$V2X_LOG" --expect-vectors contracts/golden-vectors

          # R2 forwarded on the wire, not merely logged.
          SINK_COUNT=$(grep -c '^len=' "$SINK_LOG" || true)
          echo "[LANE] ADA sink datagrams: $SINK_COUNT"
          if [ "$SINK_COUNT" -lt 6 ]; then
            echo "::error::ADA sink received $SINK_COUNT datagrams, expected >= 6 (one per vector)"
            exit 1
          fi
          echo "[LANE] comms check PASSED"
      - name: Upload comms-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2x-comms-check-logs
          path: |
            ${{ runner.temp }}/v2x.log
            ${{ runner.temp }}/ada_sink.log
          if-no-files-found: warn

  # Bench-side codec verification (11.1.8.1). This is the only lane that proves the Scenario
  # Player's R1 encoder byte-exact: it builds the SP HLD D1 cpm_encode helper on Linux and runs
  # Scenario_Player/tests with ENCODER_PATH set, which un-skips test_encoder_golden's encoder
  # equality cases (they skip everywhere the binary is absent, including sp-unit-tests above).
  sp-codec-helper:
    runs-on: ubuntu-latest
    # Same reason as v2x-core-build: codec_helper is a second build context over the same Vanetza
    # pin (SP HLD D2), so a cold _deps cache pays the identical asn1c ~1400-TU compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Boost (Vanetza hard dependency)
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libboost-date-time-dev
      # Same key CONSTRUCTION as v2x-core-build - same Vanetza pin string, so one re-pin invalidates
      # both lanes - but necessarily its own path and hashFiles set: the helper builds in a different
      # binary dir, so the two caches cannot be shared. gtest is deliberately absent from this key:
      # codec_helper/CMakeLists.txt fetches no GoogleTest (there are no C++ tests in that context).
      - name: Cache Vanetza FetchContent deps (bench build context)
        uses: actions/cache@v4
        with:
          path: Scenario_Player/codec_helper/build/_deps
          key: sp-helper-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-${{ hashFiles('Scenario_Player/codec_helper/CMakeLists.txt', 'Scenario_Player/codec_helper/cmake/vanetza-pin.cmake') }}
          restore-keys: |
            sp-helper-deps-${{ runner.os }}-vanetza-fb6c5510-json-v3.11.3-
      # No landed-file guard on any run: block below. codec_helper landed with 11.1.7.1, so a
      # `[ -f ... ] || exit 0` could only mean the folder was deleted - and it would end this lane
      # in notices with a green tick. This is the only lane proving the encoder byte-exact; a
      # missing codec_helper must be a red run.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Scenario_Player/codec_helper -B Scenario_Player/codec_helper/build
      # Bounded parallelism for the same reason as v2x-core-build: a bare `-j` passes no number to
      # make, i.e. unlimited jobs - ~700 concurrent compilers for asn1_its alone would OOM the
      # runner. Only the cpm_encode target; the context has no other.
      - name: Build cpm_encode
        shell: bash
        run: |
          set -euo pipefail
          cmake --build Scenario_Player/codec_helper/build --target cpm_encode -j $(nproc)
      # Fast pre-check ahead of pytest: if the binary is broken at all, this says so in one line
      # instead of inside a parametrized assertion dump. It encodes the SYNCED fixtures under
      # Scenario_Player/tests/fixtures/golden/ rather than the contracts/ masters, because those
      # copies are what the bench itself is built against (the masters are covered by the
      # fixture-identity tests in the pytest step, which compare the two byte-for-byte).
      - name: Smoke --encode over the six synced golden vectors
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/Scenario_Player/codec_helper/build/cpm_encode"
          if [ ! -x "$BIN" ]; then
            echo "::error::cpm_encode missing at $BIN after a successful build"
            exit 1
          fi

          echo "::group::cpm_encode --encode (one base64 line per vector)"
          COUNT=0
          for JSON in Scenario_Player/tests/fixtures/golden/*.json; do
            CASE=$(basename "$JSON" .json)
            # Capture first, assert second: under `set -e` a non-zero exit would abort the step
            # before the diagnostic could be printed.
            STATUS=0
            OUT=$("$BIN" --encode "$JSON") || STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "::error::$CASE: cpm_encode exited $STATUS (expected 0); stdout: $OUT"
              exit 1
            fi
            # Exactly one line, checked before the regex: `grep -Eq` matches if ANY line matches,
            # so without this a stray extra line would slip through.
            LINES=$(printf '%s\n' "$OUT" | wc -l | tr -d ' ')
            if [ "$LINES" -ne 1 ]; then
              echo "::error::$CASE: expected 1 stdout line, got $LINES"
              exit 1
            fi
            # Standard RFC 4648 alphabet, no whitespace, no URL-safe '-_' - the exact shape
            # player/encoder_client.py feeds to b64decode(validate=True). `+` also rejects empty.
            printf '%s' "$OUT" | grep -Eq '^[A-Za-z0-9+/]+=*$' || {
              echo "::error::$CASE: stdout is not a single bare base64 payload: $OUT"
              exit 1
            }
            BYTES=$(printf '%s' "$OUT" | base64 -d | wc -c | tr -d ' ')
            echo "[LANE] $CASE: ${#OUT} base64 chars -> $BYTES UPER bytes"
            COUNT=$((COUNT + 1))
          done
          echo "::endgroup::"

          # Also catches an unmatched glob (the loop would have run once on the literal pattern).
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::encoded $COUNT vectors, expected the 6 frozen Phase 0 cases"
            exit 1
          fi
          echo "[LANE] --encode smoke PASSED ($COUNT vectors)"
      # The wire truth of SP HLD D2, and the human-readable evidence for it: -v prints each
      # test_encoder_matches_golden_uper[<case>] PASSED. Expected totals with the binary present:
      # 123 passed, 0 skipped. Without it (e.g. the sp-unit-tests lane above, or a local run)
      # the same suite reports 116 passed, 7 skipped - the 6 encode-equality cases plus the failure-
      # contract test. Any other split means drift: fix the cause, then update these numbers.
      - name: Scenario_Player suite with ENCODER_PATH (encoder-golden unskipped)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r Scenario_Player/requirements-dev.txt
          ENCODER_PATH="$PWD/Scenario_Player/codec_helper/build/cpm_encode" \
            python -m pytest Scenario_Player/tests -v
      # No upload-artifact step on purpose: the only output worth keeping is the pytest log, which
      # is already in the job output, and the built binary is a heavy artifact that proves nothing
      # a green run does not.

  # The two node-image lanes (5.1.8.2). Same shape as phase0-ci.yml's netcheck-image - qemu + buildx,
  # single-platform arm64, attestations off, push gated on the CARSKY_ZOT_API_KEY secret, then the
  # shared pull-back verification - with three additions that netcheck (a ~20-line Python image)
  # does not need:
  #   * a buildx type=gha layer cache, because both images compile Vanetza's asn1c-generated C
  #     (asn1_support + asn1_its + asn1_its_r2, ~1400 translation units) INSIDE the image build,
  #     under QEMU aarch64 emulation on an amd64 runner;
  #   * a runtime-token export step, without which type=gha cannot reach the Actions cache from a
  #     plain `run:` step (see the step comment in v2x-ecu-image);
  #   * an application smoke against the PULLED image - the node's real command, emulated - because
  #     "starts on aarch64" and "the application works on aarch64" are different claims and only
  #     the second is what a deploy depends on.
  v2x-ecu-image:
    runs-on: ubuntu-latest
    env:
      # Live host per the O1 probe (2026-07-31): registry.carsky.io 502s, hackathon-2 answers.
      # (The node guides still name registry.carsky.io - known stale, tracked as a plan open item.)
      REGISTRY_HOST: registry.hackathon-2.carsky.io
      IMAGE: m1-v2x-ecu:latest
      # arm64 only, and for a harder reason than netcheck-image's: a CarSky Container node rejects a
      # multi-platform manifest index and hangs in Provisioning (plans/doc/phase0-smoke-test-run.md,
      # standing requirement), so exactly one platform goes in the buildx invocation.
      PLATFORMS: linux/arm64
      # Build context = the node folder, which is self-contained by the node-code-layout rule.
      # Carries its trailing slash netcheck-image style, hence "${CONTEXT}Dockerfile" below with no
      # extra separator.
      CONTEXT: V2X_ECU/
      # One cache scope PER IMAGE, never one shared scope: the gha cache is scoped storage under a
      # repo-wide eviction budget, and two ~1400-TU ASN.1 layer sets in one scope would evict each
      # other run after run - turning every run back into a cold emulated compile.
      CACHE_SCOPE: v2x-ecu-image
    # Emulated, this compile is roughly an order of magnitude slower than the ~30-40 min native
    # first build seen in v2x-core-build. 360 is the largest useful value, not a guess: GitHub
    # hard-caps a hosted-runner job at 6 h regardless of what is written here. Reruns are minutes,
    # not hours, once the type=gha cache is warm.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # ACTIONS_CACHE_URL / ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN are handed to *actions*, not
      # to `run:` steps, so a plain `docker buildx build --cache-to type=gha` cannot see them and
      # fails to configure its cache exporter. Re-exporting them through GITHUB_ENV is what makes
      # the cache work outside docker/build-push-action; actions/github-script is used rather than a
      # third-party runtime-exposing action to keep this first-party. Only names actually present are
      # exported, so an empty value can never be mistaken for a configured endpoint.
      - name: Expose the Actions cache runtime to the buildx gha cache
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (value) {
                core.exportVariable(name, value);
              }
            }
      - name: Build V2X ECU node image (arm64)
        shell: bash
        run: |
          set -euo pipefail
          # NO --load, and NO --push here, ON PURPOSE - do not "fix" this. With --platform set and
          # neither exporter given, buildx builds the image and exports nothing, which is exactly
          # what a build-only verification wants: a linux/arm64 image cannot be --loaded into an
          # amd64 runner's docker image store, so adding --load breaks the lane rather than
          # improving it. The push step below is where an exporter belongs, and the verification
          # after it gets its copy by pulling from the registry - which is the point.
          # ignore-error on --cache-to: a cache-service hiccup must not turn a successful multi-hour
          # emulated build red. A cache MISS is cheap to retry; a lost build is not.
          echo "::group::docker buildx build $IMAGE ($PLATFORMS) from $CONTEXT"
          docker buildx build \
            --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE,ignore-error=true" \
            -t "$IMAGE" \
            "$CONTEXT"
          echo "::endgroup::"
          echo "::notice::built $IMAGE ($PLATFORMS) - not pushed by this step"
      - name: Push to CarSky Zot registry (skips until the secret exists)
        id: push
        shell: bash
        env:
          ZOT_KEY: ${{ secrets.CARSKY_ZOT_API_KEY }}
          # Registry account (not a secret) - verified live 2026-07-31. Override with the
          # CARSKY_REGISTRY_USER repo variable if the account changes.
          REGISTRY_USER: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
        # `pushed` gates the two verification steps below and is written exactly once, at the end,
        # rather than in each branch - one unconditional write removes any question of what a
        # repeated key in $GITHUB_OUTPUT resolves to. It is true only past the push itself, so the
        # no-secret path correctly leaves the verification unrun.
        run: |
          set -euo pipefail
          PUSHED=false
          DIGEST=""
          if [ -z "$ZOT_KEY" ]; then
            echo "::notice::CARSKY_ZOT_API_KEY secret not set - image built but NOT pushed"
          else
            echo "$ZOT_KEY" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
            # THE SAME CACHE SCOPE as the build step above, deliberately: every layer this build
            # needs was just written to that scope, so this invocation is a cache hit that only
            # re-resolves the graph and uploads - minutes instead of a second full emulated Vanetza
            # compile. A different (or missing) scope here is the difference between ~6 minutes and
            # ~6 hours.
            # --metadata-file: buildx reports the digest it actually pushed. The verification step
            # checks the TAG, since that is what a node's image field carries; this digest is handed
            # to it only so a tag moved by a concurrent run is warned about rather than passing
            # silently.
            docker buildx build \
              --platform "$PLATFORMS" \
              --provenance=false --sbom=false \
              --cache-from "type=gha,scope=$CACHE_SCOPE" \
              --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE,ignore-error=true" \
              -t "$REGISTRY_HOST/$IMAGE" \
              --push \
              --metadata-file "$RUNNER_TEMP/push-metadata.json" \
              "$CONTEXT"
            DIGEST=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/push-metadata.json")
            echo "::notice::pushed $REGISTRY_HOST/$IMAGE ($PLATFORMS) - this is the reference a CarSky node's image field takes"
            echo "[PUSH] digest of this build: ${DIGEST:-unreported} (evidence of what was pushed; deploy by the tag above)"
            PUSHED=true
          fi
          {
            echo "pushed=$PUSHED"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the pushed image is pullable and single-platform arm64
        id: verify
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/verify-arm64-image
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          image: ${{ env.IMAGE }}
          username: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
          password: ${{ secrets.CARSKY_ZOT_API_KEY }}
          digest: ${{ steps.push.outputs.digest }}
      # The claim the deploy actually rests on: the registry copy, pulled back and run under the
      # node's own command, brings the application up on aarch64. This is where an emulation-only
      # fault would surface - a Vanetza .so that did not get staged into the runtime stage for this
      # architecture, an aarch64 loader path the amd64 build never exercised - none of which a
      # successful `docker buildx build` can rule out.
      - name: Smoke-run the pulled image (blueprint env, real entrypoint)
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        env:
          REFERENCE: ${{ steps.verify.outputs.reference }}
        run: |
          set -euo pipefail

          # Blueprint node config per requirements/car-sky-guide/node-v2x-ecu.md, with the peer
          # pointed at loopback: nothing listens, and nothing needs to - a UDP sendto succeeds
          # regardless, and the claim under test is bring-up, not delivery (v2x-comms-check above
          # is what proves the Rx chain). NET_RAW is deliberately NOT granted: capture.sh is
          # evidence rather than the mission and entrypoint.sh backgrounds it non-fatally, so this
          # run also exercises that degradation path.
          CID=$(docker run -d --platform linux/arm64 \
            -e LISTEN_PORT=47100 \
            -e ADA_ECU_HOST=127.0.0.1 \
            -e ADA_ECU_PORT=47200 \
            -e FAULT_PLAN=none \
            "$REFERENCE")
          echo "[SMOKE] container $CID started"

          # The log is captured to a FILE and grepped there, never piped from `docker logs` into
          # grep. Under `set -o pipefail` an early-exiting `grep -q` can leave the writer with
          # SIGPIPE, making a pipeline that DID match report 141 - which would invert this check
          # exactly when it matters.
          LOG="$RUNNER_TEMP/v2x-image-smoke.log"

          # Generous bound: emulated aarch64 start-up is far slower than the 6 s the native
          # v2x-comms-check lane allows for the same banner.
          READY=0
          for _ in $(seq 1 60); do
            docker logs "$CID" > "$LOG" 2>&1 || true
            if grep -q '\[BOOT\] bring-up complete' "$LOG"; then READY=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CID")" != "true" ]; then
              echo "::error::container exited before completing bring-up"
              break
            fi
            sleep 1
          done

          echo "::group::container log"
          cat "$LOG" || true
          echo "::endgroup::"

          if [ "$READY" -ne 1 ]; then
            echo "::error::v2x_ecu in $REFERENCE never logged '[BOOT] bring-up complete' - the image pulls but the application does not start on aarch64"
            docker rm -f "$CID" >/dev/null 2>&1 || true
            exit 1
          fi

          # `docker stop` sends SIGTERM to PID 1, which entrypoint.sh's `exec` made v2x_ecu itself.
          # Exit 0 is main.cpp's clean-shutdown path - the same signal the platform sends, so this
          # also checks the node will not be reported as crash-looping on a normal redeploy.
          docker stop -t 30 "$CID" >/dev/null
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CID")
          docker rm -f "$CID" >/dev/null 2>&1 || true
          echo "[SMOKE] exit code on SIGTERM: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::container exited $EXIT_CODE on SIGTERM (expected 0)"
            exit 1
          fi
          echo "::notice::$REFERENCE pulls, starts and shuts down cleanly on aarch64"

  # Bench image. Mirrors v2x-ecu-image step for step; the per-line rationale lives there and is not
  # repeated. This image is NOT the cheaper of the two: codec_helper compiles the same ASN.1 set
  # (SP HLD D2), so it carries the same timeout and its own cache scope.
  scenario-player-image:
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: registry.hackathon-2.carsky.io
      IMAGE: m1-scenario-player:latest
      PLATFORMS: linux/arm64
      CONTEXT: Scenario_Player/
      # Distinct from v2x-ecu-image's scope - see the eviction note there.
      CACHE_SCOPE: scenario-player-image
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Expose the Actions cache runtime to the buildx gha cache
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (value) {
                core.exportVariable(name, value);
              }
            }
      - name: Build Scenario Player node image (arm64)
        shell: bash
        run: |
          set -euo pipefail

          # Build-only: no --load (a cross-platform image cannot enter the local store) and no
          # --push (that is the next step). See v2x-ecu-image for the full reasoning.
          echo "::group::docker buildx build $IMAGE ($PLATFORMS) from $CONTEXT"
          docker buildx build \
            --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --cache-from "type=gha,scope=$CACHE_SCOPE" \
            --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE,ignore-error=true" \
            -t "$IMAGE" \
            "$CONTEXT"
          echo "::endgroup::"
          echo "::notice::built $IMAGE ($PLATFORMS) - not pushed by this step"
      - name: Push to CarSky Zot registry (skips until the secret exists)
        id: push
        shell: bash
        env:
          ZOT_KEY: ${{ secrets.CARSKY_ZOT_API_KEY }}
          REGISTRY_USER: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
        # Single unconditional `pushed`/`digest` write at the end - see v2x-ecu-image's push step.
        run: |
          set -euo pipefail
          PUSHED=false
          DIGEST=""
          if [ -z "$ZOT_KEY" ]; then
            echo "::notice::CARSKY_ZOT_API_KEY secret not set - image built but NOT pushed"
          else
            echo "$ZOT_KEY" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
            # Same cache scope as this job's build step, for the same reason as v2x-ecu-image: the
            # push build must be a cache hit, not a second emulated compile. --metadata-file for the
            # same reason too: the verification checks the tag, and this digest only feeds its
            # moved-tag warning.
            docker buildx build \
              --platform "$PLATFORMS" \
              --provenance=false --sbom=false \
              --cache-from "type=gha,scope=$CACHE_SCOPE" \
              --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE,ignore-error=true" \
              -t "$REGISTRY_HOST/$IMAGE" \
              --push \
              --metadata-file "$RUNNER_TEMP/push-metadata.json" \
              "$CONTEXT"
            DIGEST=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/push-metadata.json")
            echo "::notice::pushed $REGISTRY_HOST/$IMAGE ($PLATFORMS) - this is the reference a CarSky node's image field takes"
            echo "[PUSH] digest of this build: ${DIGEST:-unreported} (evidence of what was pushed; deploy by the tag above)"
            PUSHED=true
          fi
          {
            echo "pushed=$PUSHED"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the pushed image is pullable and single-platform arm64
        id: verify
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/verify-arm64-image
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          image: ${{ env.IMAGE }}
          username: ${{ vars.CARSKY_REGISTRY_USER || 'kis@hackathon.fpt.com' }}
          password: ${{ secrets.CARSKY_ZOT_API_KEY }}
          digest: ${{ steps.push.outputs.digest }}
      # Stronger than the V2X ECU smoke, because the bench's whole job is producible in isolation:
      # a [TX] line proves the Python app started, read its scenario YAML, spawned the aarch64
      # cpm_encode helper, got real UPER bytes back from Vanetza, and sent them. That is the entire
      # SP HLD D1 chain running inside the registry copy of the image.
      - name: Smoke-run the pulled image (blueprint env, real entrypoint)
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        env:
          REFERENCE: ${{ steps.verify.outputs.reference }}
        run: |
          set -euo pipefail

          # Blueprint node config per requirements/car-sky-guide/node-scenario-player.md, with the
          # V2X peer pointed at loopback: a UDP sendto needs no listener, and the claim under test
          # is generation, not delivery. SCENARIO_CONFIG is the image default made explicit.
          CID=$(docker run -d --platform linux/arm64 \
            -e SCENARIO_CONFIG=/app/scenarios/default.yaml \
            -e V2X_ECU_HOST=127.0.0.1 \
            -e V2X_ECU_PORT=47100 \
            "$REFERENCE")
          echo "[SMOKE] container $CID started"

          # Captured to a FILE and grepped there, never piped from `docker logs` into grep - see
          # the same note in v2x-ecu-image: under `set -o pipefail` an early-exiting `grep -q` can
          # leave the writer with SIGPIPE, so a pipeline that DID match reports 141 and the check
          # silently inverts.
          LOG="$RUNNER_TEMP/sp-image-smoke.log"

          # default.yaml runs at 10 Hz with loop: true, so [TX] lines appear within a second of
          # start-up natively; 90 s is the emulated allowance for start-up plus the first tick.
          SENT=0
          for _ in $(seq 1 90); do
            docker logs "$CID" > "$LOG" 2>&1 || true
            if grep -q '^\[TX\] ' "$LOG"; then SENT=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CID")" != "true" ]; then
              echo "::error::container exited before sending anything"
              break
            fi
            sleep 1
          done

          echo "::group::container log"
          cat "$LOG" || true
          echo "::endgroup::"

          docker stop -t 20 "$CID" >/dev/null 2>&1 || true
          docker rm -f "$CID" >/dev/null 2>&1 || true

          if [ "$SENT" -ne 1 ]; then
            echo "::error::no [TX] line from $REFERENCE - the image pulls but the bench does not generate CPMs on aarch64"
            exit 1
          fi

          # [ENC-SKIP] is the shape a BROKEN helper actually takes: encoder_client logs it and the
          # generator deliberately continues (SP HLD D4), so it would otherwise pass unnoticed
          # alongside the [TX] lines of ticks that did work.
          if grep -q '^\[ENC-SKIP\] ' "$LOG"; then
            echo "::error::cpm_encode failed inside the image - [ENC-SKIP] lines present"
            exit 1
          fi

          # A [TX] line alone only proves a datagram was sent; `bytes` is what proves cpm_encode
          # returned a real UPER payload rather than the loop surviving on empty sends.
          FIRST_TX=$(grep -m1 '^\[TX\] ' "$LOG" | sed 's/^\[TX\] //')
          TX_BYTES=$(printf '%s' "$FIRST_TX" | jq -r '.bytes // 0')
          echo "[SMOKE] first datagram: $FIRST_TX"
          if [ -z "$TX_BYTES" ] || [ "$TX_BYTES" -lt 1 ]; then
            echo "::error::first [TX] reports $TX_BYTES bytes - the helper produced no UPER payload"
            exit 1
          fi
          echo "::notice::$REFERENCE pulls and generates $TX_BYTES-byte CPMs on aarch64"
