<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>

  <text x="95"  y="20" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">ECU / Bench node</text>
  <text x="320" y="20" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Ethernet Bridge (L2)</text>
  <text x="535" y="20" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">Script-node Gateway</text>
  <text x="805" y="20" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">KUKSA Databroker</text>

  <!-- row 1 : Bench -->
  <rect x="20"  y="30"  width="150" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="95"  y="54"  font-size="12" fill="#1a1a1a" text-anchor="middle">Bench – Scenario Player</text>
  <text x="95"  y="72"  font-size="11" fill="#444444" text-anchor="middle">10.99.0.10</text>
  <rect x="250" y="30"  width="140" height="60" rx="6" fill="#f5f5f5" stroke="#999999"/>
  <text x="320" y="65"  font-size="12" fill="#1a1a1a" text-anchor="middle">Bench Bridge</text>
  <rect x="460" y="30"  width="150" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="535" y="54"  font-size="12" fill="#1a1a1a" text-anchor="middle">Bench Gateway</text>
  <text x="535" y="72"  font-size="11" fill="#444444" text-anchor="middle">10.99.0.11</text>
  <line x1="170" y1="60" x2="250" y2="60" stroke="#555555" stroke-width="1.5"/>
  <line x1="390" y1="60" x2="460" y2="60" stroke="#555555" stroke-width="1.5"/>
  <text x="210" y="52" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <text x="425" y="52" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <polyline points="610,60 665,60 665,190 720,190" fill="none" stroke="#d79b00" stroke-width="1.5"/>

  <!-- row 2 : V2X -->
  <rect x="20"  y="130" width="150" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="95"  y="154" font-size="12" fill="#1a1a1a" text-anchor="middle">V2X ECU</text>
  <text x="95"  y="172" font-size="11" fill="#444444" text-anchor="middle">10.99.1.10</text>
  <rect x="250" y="130" width="140" height="60" rx="6" fill="#f5f5f5" stroke="#999999"/>
  <text x="320" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">V2X Bridge</text>
  <rect x="460" y="130" width="150" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="535" y="154" font-size="12" fill="#1a1a1a" text-anchor="middle">V2X Gateway</text>
  <text x="535" y="172" font-size="11" fill="#444444" text-anchor="middle">10.99.1.11</text>
  <line x1="170" y1="160" x2="250" y2="160" stroke="#555555" stroke-width="1.5"/>
  <line x1="390" y1="160" x2="460" y2="160" stroke="#555555" stroke-width="1.5"/>
  <text x="210" y="152" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <text x="425" y="152" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <polyline points="610,160 665,160 665,195 720,195" fill="none" stroke="#d79b00" stroke-width="1.5"/>

  <!-- row 3 : ADA -->
  <rect x="20"  y="230" width="150" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="95"  y="254" font-size="12" fill="#1a1a1a" text-anchor="middle">ADA ECU</text>
  <text x="95"  y="272" font-size="11" fill="#444444" text-anchor="middle">10.99.2.10</text>
  <rect x="250" y="230" width="140" height="60" rx="6" fill="#f5f5f5" stroke="#999999"/>
  <text x="320" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">ADA Bridge</text>
  <rect x="460" y="230" width="150" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="535" y="254" font-size="12" fill="#1a1a1a" text-anchor="middle">ADA Gateway</text>
  <text x="535" y="272" font-size="11" fill="#444444" text-anchor="middle">10.99.2.11</text>
  <line x1="170" y1="260" x2="250" y2="260" stroke="#555555" stroke-width="1.5"/>
  <line x1="390" y1="260" x2="460" y2="260" stroke="#555555" stroke-width="1.5"/>
  <text x="210" y="252" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <text x="425" y="252" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <polyline points="610,260 665,260 665,225 720,225" fill="none" stroke="#d79b00" stroke-width="1.5"/>

  <!-- row 4 : IVI -->
  <rect x="20"  y="330" width="150" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="95"  y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">IVI ECU (AAOS)</text>
  <text x="95"  y="372" font-size="11" fill="#444444" text-anchor="middle">10.99.3.10</text>
  <rect x="250" y="330" width="140" height="60" rx="6" fill="#f5f5f5" stroke="#999999"/>
  <text x="320" y="365" font-size="12" fill="#1a1a1a" text-anchor="middle">IVI Bridge</text>
  <rect x="460" y="330" width="150" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="535" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">IVI Gateway</text>
  <text x="535" y="372" font-size="11" fill="#444444" text-anchor="middle">10.99.3.11</text>
  <line x1="170" y1="360" x2="250" y2="360" stroke="#555555" stroke-width="1.5"/>
  <line x1="390" y1="360" x2="460" y2="360" stroke="#555555" stroke-width="1.5"/>
  <text x="210" y="352" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <text x="425" y="352" font-size="10" fill="#777777" text-anchor="middle">eth</text>
  <polyline points="610,360 665,360 665,230 720,230" fill="none" stroke="#d79b00" stroke-width="1.5"/>

  <!-- broker -->
  <rect x="720" y="170" width="170" height="80" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="805" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">KUKSA Databroker</text>
  <text x="805" y="218" font-size="11" fill="#444444" text-anchor="middle">4 × kuksa pin</text>
  <text x="805" y="236" font-size="11" fill="#444444" text-anchor="middle">(VSS signal paths)</text>
  <text x="690" y="150" font-size="10" fill="#d79b00" text-anchor="middle">kuksa</text>

  <!-- notes -->
  <line x1="20" y1="405" x2="890" y2="405" stroke="#dddddd"/>
  <text x="20" y="425" font-size="11" fill="#333333">Data flow: Bench —47100→ V2X ECU —47200→ ADA ECU —47300→ IVI ECU. Each ECU sends only to its own gateway.</text>
  <text x="20" y="443" font-size="11" fill="#333333">Lines show pin membership, not direction: every edge is pin OUTPUT → hub INPUT. A bridge is an L2 switch and never routes.</text>
  <text x="20" y="461" font-size="11" fill="#333333">The KUKSA Databroker is the only path between the four bridges.</text>
</svg>
