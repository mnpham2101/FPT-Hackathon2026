<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- ownership band -->
  <rect x="130" y="228" width="660" height="232" rx="6" fill="#f7fafc" stroke="#2f6f9f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="146" y="250" font-size="12" font-weight="600" fill="#2f6f9f">ConditionChecker — called by the layer that acts, not by the deserialiser</text>

  <!-- datagram -->
  <rect x="200" y="24" width="220" height="44" rx="16" fill="#eceff3" stroke="#52606d" stroke-width="1.6"/>
  <text x="310" y="52" font-size="12.5" fill="#1f2933" text-anchor="middle">Datagram bytes</text>
  <path d="M310,68 L310,92" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- deserialiser -->
  <rect x="170" y="96" width="280" height="62" rx="4" fill="#e4eef7" stroke="#2f6f9f" stroke-width="1.8"/>
  <text x="310" y="120" font-size="12.5" font-weight="600" fill="#1f4d6d" text-anchor="middle" font-family="Consolas, monospace">MsgDeserializer</text>
  <text x="310" y="140" font-size="11.5" fill="#3e6a86" text-anchor="middle">syntax and type only — judges no meaning</text>
  <path d="M310,158 L310,184" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="200" y="188" width="220" height="44" rx="4" fill="#f6f8fa" stroke="#52606d" stroke-width="1.6"/>
  <text x="310" y="216" font-size="12.5" fill="#1f2933" text-anchor="middle">Typed message</text>
  <path d="M310,232 L310,266" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- trust decision -->
  <polygon points="310,270 442,312 310,354 178,312" fill="#e4eef7" stroke="#2f6f9f" stroke-width="1.8"/>
  <text x="310" y="308" font-size="12" fill="#1f4d6d" text-anchor="middle">value trusted</text>
  <text x="310" y="324" font-size="12" fill="#1f4d6d" text-anchor="middle">for this use?</text>

  <path d="M442,312 L540,312" stroke="#52606d" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="491" y="304" font-size="11.5" font-weight="600" fill="#b0521f" text-anchor="middle">no</text>
  <rect x="544" y="286" width="230" height="52" rx="4" fill="#fdf6ee" stroke="#b0521f" stroke-width="1.6"/>
  <text x="659" y="308" font-size="12" fill="#1f2933" text-anchor="middle">Draw the unknown-source</text>
  <text x="659" y="326" font-size="12" fill="#1f2933" text-anchor="middle">marker; log ERROR</text>

  <path d="M310,354 L310,382" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="326" y="372" font-size="11.5" font-weight="600" fill="#3e7d3e">yes</text>

  <!-- absence decision -->
  <polygon points="310,386 442,424 310,462 178,424" fill="#e4eef7" stroke="#2f6f9f" stroke-width="1.8"/>
  <text x="310" y="420" font-size="12" fill="#1f4d6d" text-anchor="middle">a missing value:</text>
  <text x="310" y="436" font-size="12" fill="#1f4d6d" text-anchor="middle">fault or state?</text>

  <path d="M442,424 L540,424" stroke="#52606d" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="491" y="416" font-size="11.5" font-weight="600" fill="#b0521f" text-anchor="middle">fault</text>
  <rect x="544" y="400" width="230" height="48" rx="4" fill="#fdf6ee" stroke="#b0521f" stroke-width="1.6"/>
  <text x="659" y="429" font-size="12" fill="#1f2933" text-anchor="middle">Log the fault</text>

  <path d="M310,462 L310,494" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="326" y="484" font-size="11.5" font-weight="600" fill="#3e7d3e">state</text>

  <rect x="190" y="498" width="240" height="44" rx="4" fill="#f6f8fa" stroke="#52606d" stroke-width="1.6"/>
  <text x="310" y="526" font-size="12" fill="#1f2933" text-anchor="middle">Accept — no log entry</text>
  <path d="M310,542 L310,562" stroke="#52606d" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="200" y="566" width="220" height="30" rx="14" fill="#eceff3" stroke="#52606d" stroke-width="1.6"/>
  <text x="310" y="586" font-size="12.5" fill="#1f2933" text-anchor="middle">Act — render</text>

  <!-- side rule -->
  <text x="544" y="482" font-size="11.5" font-weight="600" fill="#52606d">A fault is a value the producer</text>
  <text x="544" y="500" font-size="11.5" font-weight="600" fill="#52606d">should have sent and did not.</text>
  <text x="544" y="522" font-size="11.5" font-weight="600" fill="#52606d">A state is one it legitimately</text>
  <text x="544" y="540" font-size="11.5" font-weight="600" fill="#52606d">has nothing to report for.</text>
</svg>
