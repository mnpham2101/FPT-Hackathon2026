  <text x="562" y="540" font-size="11" fill="#3d3d46" text-anchor="middle">ADA r2_ingest</text>
  <text x="562" y="590" font-size="11" fill="#7f88ad" text-anchor="middle">+42 ms</text>
  <circle cx="759" cy="566" r="12" fill="#19226D"/>
  <text x="759" y="570" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">E8</text>
  <text x="759" y="540" font-size="11" fill="#3d3d46" text-anchor="middle">risk→medium · warning :47300</text>
  <text x="759" y="590" font-size="11" fill="#7f88ad" text-anchor="middle">+67 ms</text>
  <circle cx="1028" cy="566" r="12" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="1028" y="570" font-size="10.5" font-weight="700" fill="#19226D" text-anchor="middle">E9</text>
  <text x="1028" y="540" font-size="11" fill="#3d3d46" text-anchor="middle">IVI [RX] · banner MEDIUM</text>
  <text x="1028" y="590" font-size="11" fill="#7f88ad" text-anchor="middle">+101 ms · 50.508</text>

