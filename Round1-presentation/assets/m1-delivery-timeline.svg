  <circle cx="250" cy="254" r="13" fill="#ffffff" stroke="#B37A00" stroke-width="2"/>
  <text x="250" y="258" font-size="11" font-weight="700" fill="#B37A00" text-anchor="middle">E5</text>
  <text x="275" y="258" font-size="12" fill="#B37A00">vehicle B tracked continuously — own sensor on the looped 10 s video · d_AB ≈ 4.2 m</text>
  <!-- C track events (staggered) -->
  <line x1="902" y1="284" x2="902" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="919" y1="306" x2="919" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="948" y1="284" x2="948" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1008" y1="306" x2="1008" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1067" y1="284" x2="1067" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="1110" y1="306" x2="1110" y2="430" stroke="#c3c8de" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="200" y="292" font-size="12" fill="#3d3d46">vehicle C track (v2x_relayed):</text>
  <circle cx="902" cy="284" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="902" y="288" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E6</text>
  <circle cx="919" cy="306" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="919" y="310" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E7</text>
  <circle cx="948" cy="284" r="13" fill="#19226D" stroke="#19226D" stroke-width="2"/>
  <text x="948" y="288" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">E8</text>
  <circle cx="1008" cy="306" r="13" fill="#19226D" stroke="#19226D" stroke-width="2"/>
  <text x="1008" y="310" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">E10</text>
  <circle cx="1067" cy="284" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="1067" y="288" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E11</text>
