  <rect x="190" y="486" width="935" height="120" rx="8" fill="#ffffff" stroke="#19226D" stroke-width="1.5"/>
  <text x="206" y="510" font-size="14" font-weight="700" fill="#19226D">Per-message path — the CPM that raised the warning to MEDIUM (C at 27.0 m)</text>
  <line x1="230" y1="566" x2="1099" y2="566" stroke="#3d3d46" stroke-width="1.5"/>
  <circle cx="230" cy="566" r="12" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
