<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="790" fill="#f6f7fa"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#19226D">One warning cycle — delivery timeline (UTC times from the collected logs, 2026-08-09 18:43)</text>
  <text x="30" y="56" font-size="13" fill="#3d3d46">The bench replays its 10 s scenario and the ADA-ECU loops its 10 s video, so this cycle repeats every 10.13 s for as long as the deployment runs.</text>

  <!-- lane separator rule -->
  <line x1="182" y1="78" x2="182" y2="434" stroke="#c3c8de" stroke-width="1"/>

  <!-- ===== replay boundary guides ===== -->
  <line x1="190" y1="82" x2="190" y2="434" stroke="#E8A000" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="196" y="90" font-size="12" font-weight="700" fill="#B37A00">replay N starts · 18:43:41.559</text>
  <line x1="1051" y1="82" x2="1051" y2="434" stroke="#E8A000" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1045" y="90" font-size="12" font-weight="700" fill="#B37A00" text-anchor="end">replay N+1 starts · 18:43:51.69</text>

  <!-- ===== Bench lane ===== -->
  <text x="24" y="126" font-size="14" font-weight="700" fill="#19226D">Bench</text>
  <text x="200" y="112" font-size="12.5" fill="#B37A00">[TX] CPM · 58 B → :47100 · 10 Hz · seq climbs monotonically (one dash = one datagram)</text>
  <line x1="190" y1="126" x2="1032" y2="126" stroke="#E8A000" stroke-width="3" stroke-dasharray="2.5 6"/>
  <line x1="1051" y1="126" x2="1125" y2="126" stroke="#E8A000" stroke-width="3" stroke-dasharray="2.5 6"/>
  <text x="200" y="146" font-size="12" fill="#B37A00">scenario: C 70 m ahead → 20.5 m, closing at 5 m/s (scenario_time_s 0.0 → 9.9)</text>
  <circle cx="190" cy="126" r="13" fill="#ffffff" stroke="#B37A00" stroke-width="2"/>
  <text x="190" y="130" font-size="11" font-weight="700" fill="#B37A00" text-anchor="middle">E0</text>

  <!-- ===== V2X lane ===== -->
  <text x="24" y="186" font-size="14" font-weight="700" fill="#19226D">V2X-ECU</text>
  <line x1="190" y1="182" x2="1125" y2="182" stroke="#19226D" stroke-width="3"/>
  <circle cx="250" cy="182" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="250" y="186" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E1</text>
  <circle cx="285" cy="182" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="285" y="186" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E2</text>
  <circle cx="320" cy="182" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="320" y="186" font-size="11" font-weight="700" fill="#19226D" text-anchor="middle">E3</text>
  <text x="345" y="171" font-size="12" fill="#3d3d46">every message: rx_datagram → decode_ok → r2_forwarded · 339 B → :47200 · &lt;1 ms · all reject counters 0 (inset below)</text>

  <!-- ===== ADA lane ===== -->
  <text x="24" y="262" font-size="14" font-weight="700" fill="#19226D">ADA-ECU</text>
  <!-- ingest row -->
  <line x1="190" y1="224" x2="1125" y2="224" stroke="#19226D" stroke-width="2"/>
  <circle cx="250" cy="224" r="13" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
