    <line x1="445" y1="430" x2="445" y2="436" stroke="#3d3d46"/><text x="445" y="450">3</text>
    <line x1="530" y1="430" x2="530" y2="436" stroke="#3d3d46"/><text x="530" y="450">4</text>
