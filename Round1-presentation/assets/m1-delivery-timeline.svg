  <text x="230" y="540" font-size="11" fill="#3d3d46" text-anchor="middle">CPM in :47100</text>
  <text x="230" y="590" font-size="11" fill="#7f88ad" text-anchor="middle">0 ms · 50.407</text>
  <circle cx="288" cy="566" r="12" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
  <text x="288" y="570" font-size="9.5" font-weight="700" fill="#19226D" text-anchor="middle">E2·3</text>
  <text x="288" y="526" font-size="11" fill="#3d3d46" text-anchor="middle">decoded + forwarded :47200</text>
  <text x="288" y="590" font-size="11" fill="#7f88ad" text-anchor="middle">+1 ms</text>
  <circle cx="562" cy="566" r="12" fill="#ffffff" stroke="#19226D" stroke-width="2"/>
