  <text x="30" y="634" font-size="14" font-weight="700" fill="#19226D">Event key — UTC times 18:43:xx from the collected logs</text>
  <g font-size="12" fill="#3d3d46">
    <text x="30" y="656"><tspan font-weight="700" fill="#19226D">E0</tspan> 41.559 — replay starts: first CPM of the cycle, C 70 m ahead</text>
    <text x="30" y="676"><tspan font-weight="700" fill="#19226D">E1</tspan> CPM datagram received on :47100 — 58 B, every 100 ms</text>
