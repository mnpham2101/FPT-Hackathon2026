    <text x="30" y="776"><tspan font-weight="700" fill="#19226D">E6</tspan> 49.943 — C crosses the 30 m gate → track tentative (29.5 m)</text>
    <text x="600" y="656"><tspan font-weight="700" fill="#19226D">E7</tspan> 50.143 — C confirmed → tracked (28.5 m)</text>
    <text x="600" y="676"><tspan font-weight="700" fill="#19226D">E8</tspan> 50.474 — risk low→medium · warning sent on :47300 (515 B)</text>
    <text x="600" y="696"><tspan font-weight="700" fill="#19226D">E9</tspan> 50.508 — warning received on the IVI · banner MEDIUM, ghost C drawn</text>
    <text x="600" y="716"><tspan font-weight="700" fill="#19226D">E10</tspan> 51.177 — risk medium→high · warning sent and shown</text>
    <text x="600" y="736"><tspan font-weight="700" fill="#19226D">E11</tspan> 51.878 — replay wrapped, C back at 70 m → gate exit, track dropped</text>
    <text x="600" y="756"><tspan font-weight="700" fill="#19226D">E12</tspan> 52.376 — risk →low · warning sent · ghost C cleared</text>
