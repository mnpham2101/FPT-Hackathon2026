<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>R17 God View — Tesla-style top-down warning screen: ego A, occluder B, ghost C</title>
  <desc>Design reference for the R17 warning view rendered in the R16 Display area: a dark, lane-marked top-down driving scene; ego A solid at the bottom, occluder B ahead of it, and ghost C — reconstructed from v2x_relayed data only — drawn dashed and glowing inside A's blind zone behind B.</desc>

  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C10"/>
      <stop offset="0.55" stop-color="#0D0D1A"/>
      <stop offset="1" stop-color="#121425"/>
    </linearGradient>
    <linearGradient id="roadFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#23262F"/>
      <stop offset="0.7" stop-color="#1B1E27"/>
      <stop offset="1" stop-color="#14161E"/>
    </linearGradient>
    <linearGradient id="egoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6FB"/>
      <stop offset="0.5" stop-color="#D3DCE8"/>
      <stop offset="1" stop-color="#A9B5C6"/>
    </linearGradient>
    <linearGradient id="bBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#848C9B"/>
      <stop offset="0.5" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#4E5561"/>
    </linearGradient>
    <linearGradient id="horizonFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D1A" stop-opacity="1"/>
      <stop offset="1" stop-color="#0D0D1A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="blindHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FF4040" stroke-width="1.1" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- ================= screen ================= -->
  <rect width="1000" height="640" fill="url(#screenBg)"/>

  <!-- ================= road ================= -->
  <polygon points="140,640 460,640 420,56 180,56" fill="url(#roadFill)"/>
  <!-- road edges -->
  <line x1="140" y1="640" x2="180" y2="56" stroke="#3A4050" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="460" y1="640" x2="420" y2="56" stroke="#3A4050" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- lane dividers -->
  <line x1="247" y1="640" x2="260" y2="56" stroke="#333355" stroke-width="2" stroke-dasharray="24 16"/>
  <line x1="353" y1="640" x2="340" y2="56" stroke="#333355" stroke-width="2" stroke-dasharray="24 16"/>
  <!-- ============ blind zone: A's line of sight, blocked by B ============ -->
  <polygon points="300,470 235,56 365,56" fill="url(#blindHatch)"/>
  <polygon points="300,470 235,56 365,56" fill="#FF4040" fill-opacity="0.05"/>
  <line x1="300" y1="470" x2="235" y2="56" stroke="#FF4040" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 7"/>
  <line x1="300" y1="470" x2="365" y2="56" stroke="#FF4040" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 7"/>

  <!-- distance fade toward the top, over road and blind zone alike -->
  <rect x="0" y="56" width="600" height="150" fill="url(#horizonFade)"/>

  <text x="300" y="271" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#FF7A7A" fill-opacity="0.7">BLIND ZONE</text>

  <!-- ================= ghost C (v2x_relayed) ================= -->
  <g transform="translate(300,188) scale(0.86)">
    <!-- pulsing risk glow: colour = risk state, 1.2 s period, alpha 0.3 → 0.8 -->
    <ellipse cx="0" cy="0" rx="50" ry="74" fill="none" stroke="#FF1A1A" stroke-width="9" opacity="0.45" filter="url(#soft)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- reconstructed body: dashed outline, translucent fill -->
    <path d="M0,-50 c14,0 24,8 24,20 v60 c0,12 -8,20 -24,20 -16,0 -24,-8 -24,-20 v-60 c0,-12 10,-20 24,-20 z"
          fill="#FF4040" fill-opacity="0.16" stroke="#FF4040" stroke-width="3" stroke-dasharray="12 8"/>
    <rect x="-16" y="-16" width="32" height="28" rx="7" fill="#FF4040" fill-opacity="0.12" stroke="#FF4040" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="0" y="72" text-anchor="middle" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#E8E8F0">C</text>
  </g>

  <!-- ghost C badge -->
  <g>
    <rect x="163" y="92" width="274" height="30" rx="7" fill="#1A1A2E" fill-opacity="0.88" stroke="#FF4040" stroke-opacity="0.55"/>
    <text x="300" y="112" text-anchor="middle" font-size="13.5" font-family="ui-monospace, Consolas, monospace" fill="#E8E8F0">[V2X] C · 35.0 m · RISK: HIGH</text>
  </g>

  <!-- ================= vehicle B (occluder, seen directly) ================= -->
  <g transform="translate(300,330) scale(0.92)">
    <ellipse cx="0" cy="8" rx="42" ry="60" fill="#FFB300" opacity="0.10" filter="url(#soft)"/>
    <path d="M0,-50 c14,0 24,8 24,20 v60 c0,12 -8,20 -24,20 -16,0 -24,-8 -24,-20 v-60 c0,-12 10,-20 24,-20 z"
          fill="url(#bBody)" stroke="#FFB300" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="-31" y="-16" width="9" height="5" rx="2.5" fill="#59606D"/>
    <rect x="22" y="-16" width="9" height="5" rx="2.5" fill="#59606D"/>
    <path d="M-17,-16 h34 l-6,-14 h-22 z" fill="#1D222C"/>
    <rect x="-16" y="-16" width="32" height="28" rx="7" fill="#151A22"/>
    <path d="M-17,12 h34 l-5,13 h-24 z" fill="#1D222C"/>
    <rect x="-19" y="-47" width="12" height="5" rx="2.5" fill="#E7EDF5" opacity="0.7"/>
    <rect x="7" y="-47" width="12" height="5" rx="2.5" fill="#E7EDF5" opacity="0.7"/>
    <rect x="-19" y="43" width="12" height="5" rx="2.5" fill="#FF4040" opacity="0.75"/>
    <rect x="7" y="43" width="12" height="5" rx="2.5" fill="#FF4040" opacity="0.75"/>
    <text x="0" y="72" text-anchor="middle" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#E8E8F0">B</text>
  </g>

  <!-- ================= ego A ================= -->
  <g transform="translate(300,520)">
    <ellipse cx="0" cy="8" rx="52" ry="72" fill="#00D4FF" opacity="0.13" filter="url(#softer)"/>
    <path d="M0,-50 c14,0 24,8 24,20 v60 c0,12 -8,20 -24,20 -16,0 -24,-8 -24,-20 v-60 c0,-12 10,-20 24,-20 z"
          fill="url(#egoBody)" stroke="#EAF6FF" stroke-opacity="0.65" stroke-width="1.6"/>
    <rect x="-31" y="-16" width="9" height="5" rx="2.5" fill="#AEB8C6"/>
    <rect x="22" y="-16" width="9" height="5" rx="2.5" fill="#AEB8C6"/>
    <path d="M-17,-16 h34 l-6,-14 h-22 z" fill="#1B2430"/>
    <rect x="-16" y="-16" width="32" height="28" rx="7" fill="#141C26"/>
    <path d="M-17,12 h34 l-5,13 h-24 z" fill="#1B2430"/>
    <rect x="-19" y="-47" width="12" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92"/>
    <rect x="7" y="-47" width="12" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="76" text-anchor="middle" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#E8E8F0">EGO (A)</text>
  </g>

  <!-- ================= distance rails ================= -->
  <!-- A → B, left of the road -->
  <g stroke="#555577" stroke-width="1.4">
    <line x1="105" y1="330" x2="105" y2="520"/>
    <line x1="97" y1="330" x2="113" y2="330"/>
    <line x1="97" y1="520" x2="113" y2="520"/>
  </g>
  <text x="97" y="425" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#9AA0B4" transform="rotate(-90 97 425)">d_AB = 20.0 m</text>
  <!-- A → C, right of the road -->
  <g stroke="#555577" stroke-width="1.4" stroke-dasharray="8 6">
    <line x1="500" y1="188" x2="500" y2="520"/>
  </g>
  <g stroke="#555577" stroke-width="1.4">
    <line x1="492" y1="188" x2="508" y2="188"/>
    <line x1="492" y1="520" x2="508" y2="520"/>
  </g>
  <text x="516" y="354" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#9AA0B4" transform="rotate(-90 516 354)">d_AC ≈ 35.0 m</text>

  <!-- ================= header ================= -->
  <text x="40" y="36" font-size="13" letter-spacing="2.4" fill="#6E7690">COOPERATIVE AWARENESS</text>

  <!-- ================= side panel ================= -->
  <line x1="600" y1="40" x2="600" y2="600" stroke="#262B38" stroke-width="1.5"/>

  <text x="640" y="36" font-size="13" letter-spacing="2.4" fill="#6E7690">GOD VIEW · 3 VEHICLES</text>

  <!-- ego legend -->
  <g transform="translate(640,86)">
    <rect x="0" y="-14" width="26" height="44" rx="10" fill="url(#egoBody)" stroke="#EAF6FF" stroke-opacity="0.6"/>
    <text x="46" y="2" font-size="15" fill="#E8E8F0">EGO (A)</text>
    <text x="46" y="24" font-size="12.5" fill="#8A91A6">this vehicle · own sensors</text>
  </g>

  <!-- B legend -->
  <g transform="translate(640,166)">
    <rect x="0" y="-14" width="26" height="44" rx="10" fill="url(#bBody)" stroke="#FFB300" stroke-opacity="0.6"/>
    <text x="46" y="2" font-size="15" fill="#E8E8F0">B — OCCLUDER</text>
    <text x="46" y="24" font-size="12.5" fill="#8A91A6">detected directly by A</text>
  </g>

  <!-- C legend -->
  <g transform="translate(640,246)">
    <rect x="0" y="-14" width="26" height="44" rx="10" fill="#FF4040" fill-opacity="0.16" stroke="#FF4040" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="46" y="2" font-size="15" fill="#FF7A7A">C — GHOST</text>
    <text x="46" y="24" font-size="12.5" font-family="ui-monospace, Consolas, monospace" fill="#8A91A6">source: v2x_relayed</text>
    <text x="46" y="44" font-size="12.5" fill="#8A91A6">never seen by A's sensors</text>
  </g>

  <!-- blind zone legend -->
  <g transform="translate(640,346)">
    <rect x="0" y="-14" width="26" height="44" rx="6" fill="url(#blindHatch)" stroke="#FF4040" stroke-opacity="0.3"/>
    <text x="46" y="2" font-size="15" fill="#E8E8F0">BLIND ZONE</text>
    <text x="46" y="24" font-size="12.5" fill="#8A91A6">A's line of sight, blocked by B</text>
  </g>

  <line x1="640" y1="410" x2="960" y2="410" stroke="#262B38" stroke-width="1.5"/>

  <!-- risk legend: the glow colour around C, not a banner -->
  <g transform="translate(640,450)">
    <text x="0" y="0" font-size="12" letter-spacing="1.8" fill="#6E7690">RISK — GHOST C GLOW COLOUR</text>
    <g font-size="12.5" font-family="ui-monospace, Consolas, monospace">
      <circle cx="9" cy="26" r="7" fill="#FFB300"/><text x="28" y="31" fill="#8A91A6">LOW</text>
      <circle cx="109" cy="26" r="7" fill="#FF6600"/><text x="128" y="31" fill="#8A91A6">MEDIUM</text>
      <circle cx="229" cy="26" r="7" fill="#FF1A1A"/><text x="248" y="31" fill="#E8E8F0">HIGH</text>
    </g>
  </g>

  <text x="640" y="560" font-size="12.5" fill="#6E7690">Drawn from R4 warning messages only —</text>
  <text x="640" y="580" font-size="12.5" fill="#6E7690">no ego detection of C exists at any point.</text>
</svg>
