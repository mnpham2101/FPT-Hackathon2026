<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1340" font-family="Segoe UI, Arial, sans-serif">
  <!-- "The potentiality" section: V2V hardware cost per vehicle, 2020 -> 2058,
       per NHTSA DOT HS 812 014. The report gives only these two anchor years
       (a "learning curve" narrative, not a published yearly series), so this
       draws the honest two-point low/high range rather than inventing a
       smoothed multi-year curve. Fonts tripled from the previous version
       (18-30px -> 54-90px) for projector legibility; the footnote wraps
       across three lines to stay readable at that size. -->
  <rect x="0" y="0" width="2200" height="1340" fill="#ffffff"/>

  <text x="1100" y="110" text-anchor="middle" font-size="90" fill="#52514e">V2V hardware cost per vehicle</text>
  <text x="1100" y="180" text-anchor="middle" font-size="60" fill="#898781">learning-curve range, NHTSA DOT HS 812 014</text>

  <!-- gridlines -->
  <g stroke="#e1e0d9" stroke-width="2">
    <line x1="350" y1="820" x2="2050" y2="820"/>
    <line x1="350" y1="640" x2="2050" y2="640"/>
    <line x1="350" y1="460" x2="2050" y2="460"/>
    <line x1="350" y1="280" x2="2050" y2="280"/>
  </g>
  <line x1="350" y1="1000" x2="2050" y2="1000" stroke="#c3c2b7" stroke-width="2"/>
  <g font-size="66" fill="#898781" text-anchor="end">
    <text x="330" y="1006">$0</text>
    <text x="330" y="826">$100</text>
    <text x="330" y="646">$200</text>
    <text x="330" y="466">$300</text>
    <text x="330" y="286">$400</text>
  </g>

  <!-- low-high range band -->
  <polygon points="650,386.2 1750,623.8 1750,591.4 650,370" fill="#2a78d6" fill-opacity="0.10"/>
  <polyline points="650,386.2 1750,623.8" fill="none" stroke="#2a78d6" stroke-width="3"/>
  <polyline points="650,370 1750,591.4" fill="none" stroke="#2a78d6" stroke-width="3"/>

  <!-- endpoint markers, surface ring -->
  <g fill="#2a78d6" stroke="#ffffff" stroke-width="5">
    <circle cx="650" cy="386.2" r="14"/>
    <circle cx="650" cy="370" r="14"/>
    <circle cx="1750" cy="623.8" r="14"/>
    <circle cx="1750" cy="591.4" r="14"/>
  </g>

  <!-- direct labels -->
  <text x="615" y="378" text-anchor="end" font-size="78" font-weight="600" fill="#0b0b0b">$341&#8211;$350</text>
  <text x="1785" y="608" text-anchor="start" font-size="78" font-weight="600" fill="#0b0b0b">$209&#8211;$227</text>

  <!-- x-axis -->
  <g text-anchor="middle" font-size="66" fill="#52514e">
    <text x="650" y="1090">2020</text>
    <text x="1750" y="1090">2058</text>
  </g>

  <g text-anchor="middle" font-size="54" fill="#898781">
    <text x="1100" y="1150">Two data points from the report &#8212;</text>
    <text x="1100" y="1216">band shows the low&#8211;high estimate range,</text>
    <text x="1100" y="1282">not a measured yearly curve.</text>
  </g>
</svg>
