<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIS — Keep It Simple</title>
  <!-- The site lives in website/. This page exists so that opening the root —
       http://localhost:8080/ after `python -m http.server` at the repo root, or
       this file straight off disk — lands on it instead of a 404 or a directory
       listing. A refresh rather than a script: it works over file:// too, where
       the bundle build (build-pages.py --bundle) reuses this same page as its
       entry point. -->
  <meta http-equiv="refresh" content="0; url=website/index.html">
  <link rel="canonical" href="website/index.html">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 15vh auto; max-width: 30rem; text-align: center; color: #2f3138; }
    a { color: #b0521f; }
  </style>
</head>
<body>
  <p>Opening <a href="website/index.html">website/index.html</a>&nbsp;…</p>
</body>
</html>
